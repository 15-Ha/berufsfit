<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Berufsfit Schweiz</title>
<style>
:root{--bg:#f3f6ee;--card:#fff;--ink:#1b2430;--mute:#5d6b7c;--pri:#aecb35;--pri-d:#9ab92a;--pri-t:#4a6310;--onpri:#1b2430;--ok:#aecb35;--onok:#1b2430;--okt:#3f6b12;--bad:#c2410c;--line:#e1e6d8;--soft:#f0f6d9;--sh:0 1px 2px rgba(27,36,48,.06),0 6px 18px rgba(27,36,48,.06)}
@media(prefers-color-scheme:dark){:root{--bg:#12170e;--card:#1b2216;--ink:#eef2e6;--mute:#a3b093;--pri:#aecb35;--pri-d:#c1dc4d;--pri-t:#c4e04f;--onpri:#1b2430;--ok:#aecb35;--onok:#1b2430;--okt:#b9de5a;--bad:#ff9d6e;--line:#2c3622;--soft:#28331a;--sh:0 1px 2px rgba(0,0,0,.4)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 ui-rounded,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased}
#app{max-width:760px;margin:0 auto;padding:12px 16px 110px}
h1{font-size:1.6rem;margin:.2em 0}h2{font-size:1.25rem;margin:.2em 0 .5em}h3{font-size:1.05rem;margin:1em 0 .3em}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin:14px 0;box-shadow:var(--sh)}
.lead{color:var(--mute)}.small{font-size:.85rem;color:var(--mute)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
input,select{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);min-height:44px}
input[type=text],input:not([type]){flex:1;min-width:140px}#q{width:100%}
label{display:block;margin:.6em 0}
.btn{font:inherit;font-weight:700;background:var(--pri);color:var(--onpri);border:0;border-radius:999px;padding:10px 20px;min-height:46px;cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.12);transition:transform .08s,background .15s}.btn:active{transform:translateY(1px)}
.btn:hover{background:var(--pri-d)}.btn.ghost{background:transparent;color:var(--pri-t);border:2px solid var(--pri);box-shadow:none}
.small-btn{padding:8px 14px}
.link{background:none;border:0;color:var(--pri-t);cursor:pointer;font:inherit;padding:6px 4px;text-decoration:underline}
.seg{display:flex;gap:6px;margin:10px 0}
.seg button{flex:1;font:inherit;font-weight:700;padding:10px 6px;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;cursor:pointer;min-height:44px}
.seg button.on{background:var(--pri);color:var(--onpri);border-color:var(--pri)}
.schoolist{max-height:none}.schoolist button{display:flex;flex-direction:column;gap:2px}
.simtime{font-weight:800;font-variant-numeric:tabular-nums;background:var(--soft);padding:4px 10px;border-radius:999px}.simtime.low{background:#ffe9b0;color:#5b3d00}.simtime.over{background:#f6c9c9;color:#6b1111}
.exam ul{padding-left:20px}.exam li{margin:4px 0}
.tlist{max-height:48vh;overflow:auto;border:1px solid var(--line);border-radius:14px;margin-top:8px}
.tlist button{display:block;width:100%;text-align:left;font:inherit;background:var(--card);color:var(--ink);border:0;border-bottom:1px solid var(--line);padding:12px;min-height:44px;cursor:pointer}
.tlist button:hover{background:var(--soft)}.tlist button:last-child{border-bottom:0}
.top{display:flex;justify-content:space-between;align-items:center;padding:8px 0}
.tabs{display:flex;gap:2px;position:fixed;left:50%;transform:translateX(-50%);bottom:max(10px,env(safe-area-inset-bottom));width:min(560px,calc(100% - 20px));background:var(--card);border:1px solid var(--line);border-radius:26px;box-shadow:0 8px 28px rgba(27,36,48,.18);padding:6px;z-index:5}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font:inherit;font-weight:600;font-size:.72rem;padding:7px 2px;border:0;background:transparent;color:var(--mute);border-radius:20px;cursor:pointer;min-height:48px}.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab.on{background:var(--pri);color:var(--onpri)}
.st{display:inline-flex;align-items:flex-end;gap:2px;height:16px;vertical-align:middle}.st i{width:5px;border-radius:1px;background:var(--line);display:block}
.st i:nth-child(1){height:30%}.st i:nth-child(2){height:48%}.st i:nth-child(3){height:66%}.st i:nth-child(4){height:83%}.st i:nth-child(5){height:100%}.st i.on{background:var(--ok)}
.lvline{display:flex;align-items:center;gap:8px;margin:8px 0}.lvline .st{height:22px}.stars{color:#e0a800;letter-spacing:1px;font-size:1rem;white-space:nowrap}.stars .e{color:#c4c8b6}
.mini{align-items:center;gap:6px}.lv{display:inline-flex;align-items:center;min-width:34px}
.pills{display:flex;gap:4px;margin:6px 0}
.pill{display:inline-block;min-width:30px;text-align:center;font-size:.8rem;font-weight:700;border-radius:6px;border:1px solid var(--line);color:var(--mute);padding:2px 6px}
.pill.on{background:var(--ok);border-color:var(--ok);color:var(--onok)}
.badge{font-size:.75rem;color:var(--okt);font-weight:700}
.items{list-style:none;padding:0;margin:8px 0}
.items label{display:flex;gap:8px;align-items:flex-start;margin:0;padding:8px 6px;border-bottom:1px solid var(--line)}
.items label.req{background:var(--soft)}
.items input{min-height:auto;flex:none;margin-top:4px}
.lv{font-weight:700;color:var(--mute);min-width:1.2em}
.theme{margin:20px 0 0;font-size:1.1rem}.area{margin:10px 0 0;color:var(--mute);font-size:.95rem}
.merke{background:var(--soft);border-left:4px solid var(--pri);padding:8px 12px;border-radius:6px}
.example{border:1px dashed var(--pri);border-radius:8px;padding:10px 14px;margin-top:12px}
.step{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.92rem;padding:1px 0}
.res{font-weight:700;margin-top:6px;color:var(--okt)}
.ans{max-width:180px}.unit{color:var(--mute)}
.fb{min-height:1.4em;margin:6px 0;font-weight:600}.fb.ok{color:var(--okt)}.fb.bad{color:var(--bad)}
.sol{background:var(--soft);border-radius:8px;padding:8px 12px;margin-top:6px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.92rem}
.fig{margin:8px 0;overflow-x:auto}.fig svg{max-width:100%;height:auto;background:#fff;border-radius:8px;border:1px solid var(--line)}.opts{display:flex;flex-direction:column;gap:6px;margin:6px 0}.opt{display:flex;gap:8px;align-items:flex-start;margin:0;padding:8px 10px;border:1px solid var(--line);border-radius:8px;min-height:44px}.opt input{min-height:auto;margin-top:4px}.flds{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}.fld{display:flex;gap:6px;align-items:center;margin:0}.fld>span:first-child{min-width:5em}.fld .ans{max-width:110px;min-width:70px}
.prog{height:12px;background:var(--line);border-radius:999px;overflow:hidden;margin:8px 0}.prog>div{height:100%;background:linear-gradient(90deg,#8fb82a,var(--ok));border-radius:999px;transition:width .4s}
.lvbar{display:flex;gap:4px;margin:8px 0}.seg5{flex:1;text-align:center;font-size:.8rem;font-weight:700;border-radius:6px;padding:4px 0;border:1px solid var(--line);color:var(--mute)}.seg5.on{background:var(--ok);border-color:var(--ok);color:var(--onok)}.seg5.na{opacity:.4}
.chip{display:inline-block;font-size:.78rem;font-weight:700;border-radius:999px;padding:3px 10px;border:1px solid var(--line);color:var(--mute);background:var(--card)}.chip.ok{background:var(--ok);border-color:var(--ok);color:var(--onok)}.chip.mid{background:#ffd166;border-color:#ffd166;color:#222}.chip.gap{background:#ff8a5c;border-color:#ff8a5c;color:#222}.chip.na{opacity:.7}
.cc>summary.ccs{list-style:none;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;cursor:pointer;min-height:44px}.cc>summary.ccs::-webkit-details-marker{display:none}
.cct{flex:1 1 100%}.cc[open]>summary.ccs{margin-bottom:6px}.mini{display:inline-flex;gap:2px}
.cc[open] .mini{display:none}.seg button{font-size:.9rem}.ccs::after{content:"▾";margin-left:auto;opacity:.6}.cc[open]>.ccs::after{content:"▴"}
.ct{margin:.5em 0 .2em;font-size:1.15rem}.cd{margin:.2em 0}.eg{margin:.4em 0;padding:8px 10px;background:var(--soft);border-radius:8px;font-size:.92rem}.official{opacity:.8}
details.more{margin-top:8px}.big{font-size:1.3rem;font-weight:700;margin:.2em 0}.rrow{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}.rrow .rt{flex:1}
.chk{display:flex;gap:8px;align-items:center}
.sel{display:flex;gap:8px;align-items:center;margin:0}.sel input{min-height:auto}
.note{background:var(--soft);border-radius:8px;padding:8px 12px;font-size:.9rem}
.dossier{background:#fff;color:#111;border:1px solid var(--line);border-radius:12px;padding:20px;margin:16px 0}
.dossier .merke{background:#eef3fb}.dossier .small{color:#555}
.dsec{margin-bottom:24px}.dex{margin:10px 0}.line{margin-top:6px;color:#666;border-bottom:1px solid #ccc;padding-bottom:14px}
.dsec.sols{break-before:page}.dossier li{margin:2px 0}
@media print{
  body{background:#fff}#app>*{display:none!important}
  #app{max-width:none;padding:0}
  #app main,#app main>*{display:block!important}
  .no-print,.tabs,.top,details.foot,.imp{display:none!important}
  #app main>.card{display:none!important}
  #app main>#dossier,#app main>#dossier *{display:revert!important}
  .dossier{border:0;padding:0}.dsec{break-inside:avoid-page}
}
.gtag{color:var(--muted,#667);text-transform:uppercase;letter-spacing:.04em;font-size:.72rem}.grow{margin:10px 0}

.brandbar{display:flex;align-items:center;gap:12px}
.logo{background:var(--pri);border-radius:16px;padding:8px 12px;display:inline-flex}.logo img{height:34px;width:auto;display:block}
.hero0{background:linear-gradient(135deg,var(--pri),#d3e66f);color:#1b2430;border:0;padding:22px 20px}.hero0 h1{font-size:1.9rem;line-height:1.15;margin:.5em 0 .2em}.hero0 .lead{color:#26331a}.hero0 .logo{background:#fff;box-shadow:var(--sh)}
.how{display:flex;gap:8px;margin:14px 0 4px;flex-wrap:wrap}.how span{background:rgba(255,255,255,.7);border-radius:999px;padding:5px 12px;font-size:.85rem;font-weight:700;color:#1b2430}
.hero{box-shadow:inset 0 6px 0 var(--pri),var(--sh)}
.way{display:flex;align-items:flex-start;gap:0;margin:10px 0 14px}.wstep{flex:1;text-align:center;position:relative;font-size:.8rem;font-weight:600;color:var(--mute)}
.wstep i{display:flex;margin:0 auto 4px;width:32px;height:32px;border-radius:50%;background:var(--line);color:var(--mute);align-items:center;justify-content:center;font-style:normal;font-weight:800;position:relative;z-index:1}
.wstep:not(:last-child):after{content:'';position:absolute;top:15px;left:calc(50% + 18px);right:calc(-50% + 18px);height:3px;background:var(--line)}
.wstep.done i{background:var(--pri);color:var(--onpri)}.wstep.done:not(:last-child):after{background:var(--pri)}.wstep.cur i{background:var(--ink);color:var(--card)}.wstep.cur,.wstep.done{color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.legend span{font-size:.78rem;border:1px solid var(--line);border-radius:999px;padding:2px 10px;background:var(--card)}.legend b{color:var(--pri-t)}
.lvtxt{margin:2px 0 6px}
.mnav{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.mnav a{font-size:.85rem;font-weight:600;text-decoration:none;color:var(--ink);background:var(--soft);border-radius:999px;padding:5px 12px;border:1px solid var(--line)}.mnav a.gap{background:#ffe0d2;border-color:#ff8a5c;color:#3a1c0c}.mnav a.mid{background:#fff0c4;border-color:#ffd166;color:#3a2e0c}
.mtag{display:inline-block;margin-left:6px}
.gapc{border-left:6px solid #ff8a5c}
.foot summary{cursor:pointer}
.imp{margin:26px 0 8px;text-align:center;color:var(--mute);font-size:.72rem;opacity:.75}.imp img{height:22px;width:auto;opacity:.55;vertical-align:middle;margin-right:6px}.imp summary{cursor:pointer;list-style:none;display:inline-flex;align-items:center}.imp summary::-webkit-details-marker{display:none}.imp p{max-width:34em;margin:8px auto;text-align:left}
.top{gap:12px}.top .brandbar{min-width:0}.top .tn{font-weight:800;font-size:1.05rem;line-height:1.25}
.fb.ok{animation:pop .3s}@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.stick{position:sticky;top:6px;z-index:4;padding:10px 16px}.stick .prog{margin:6px 0 0}
.themed>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px}.themed>summary::-webkit-details-marker{display:none}.themed>summary:after{content:'▾';color:var(--mute);margin-left:auto;transition:transform .2s}.themed:not([open])>summary:after{transform:rotate(-90deg)}.themed>summary h2{flex:1}
summary{min-height:44px;display:flex;align-items:center;padding:4px 0}details.themed>summary{min-height:44px}
label.sel{min-height:44px;padding:8px 0}.link{min-height:44px;padding:10px 8px}
.mnav a{padding:10px 14px;min-height:44px;display:inline-flex;align-items:center;font-size:.9rem}
.chip{font-size:.85rem}.pill{font-size:.85rem}.seg5{font-size:.95rem;padding:7px 0}.gtag{font-size:.8rem!important}.legend span{font-size:.85rem}.tab{font-size:.76rem}.foot a{padding:8px 0;display:inline-block}
</style>
</head>
<body>
<div id="app"></div>
<script>
// === DATEN: Mathematik (Quelle: BKD Kanton Bern, Kompetenzraster «Mathematik-Anforderungen beim Eintritt in die Berufslehre») ===
// Abgerufen am 27.10.2026 über die öffentliche API von bkd-kompetenzraster-ktbern.ch (Raster-Version Februar 2018).
// Format Raster: T|Nr|Thema · A|Nr|Bereich · C|Nr|Kompetenz|Handlungsaspekte · I|Stufe|Item-Text (Reihenfolge = Bitposition in der Maske)
// Format Berufe: Typ|Maske|Name. Maske = 130 Items als Hex (Bit gesetzt = im Beruf gefordert = «grün» im BKD-Raster).
const BKD_MATHE_RASTER = `T|M1|Zahl und Variable
A|M1.1|Ganze Zahlen
C|1.1.1|Operieren mit ganzen Zahlen|O&B
I|A|Grundoperationen mit natürlichen Zahlen durchführen
I|A|Zahlen erkennen, die durch 2, 5, 10, 100, 1'000 teilbar sind
I|B|Zahlen bis 1 Milliarde lesen und schreiben
I|B|Grundoperationen mit natürlichen Zahlen überschlagen
I|C|Teilbarkeitsregeln (3, 4, 6, 8, 9, 25, 50) nutzen und Teiler natürlicher Zahlen bestimmen
I|D|Grundoperationen mit ganzen Zahlen durchführen
I|E|Natürliche Zahlen in Primfaktoren zerlegen
C|1.1.2|Potenzieren und radizieren, 10er Potenzen bestimmen, darstellen, erforschen|E&A,M&D,O&B
I|A|Die ersten 20 Quadratzahlen ohne TR bestimmen und geometrisch deuten
I|B|Wurzeln und Potenzen mit dem Rechner berechnen, sowie einfache Wurzeln und Potenzen im Kopf bestimmen
I|C|Ein Produkt mit gleichen Faktoren als Potenz schreiben und umgekehrt
I|D|Zahlen in wissenschaftlicher Schreibweise mit positiven und negativen Exponenten lesen und schreiben
I|E|Zahlen in wissenschaftlicher Schreibweise mit positiven Exponenten addieren, subtrahieren, multiplizieren, dividieren
C|1.1.3|Muster und Beziehungen bei ganzen Zahlen erforschen, beschreiben, darstellen|E&A,M&D
I|A|Systematische Aufgabenfolgen bilden, weiterführen, verändern und beschreiben
I|A|Gesetzmässigkeiten im Bereich der natürlichen Zahlen erforschen (z.B. mithilfe der Stellentafel) und mit Beispielen konkretisieren
I|B|Figurenfolgen in systematische Aufgabenfolgen übersetzen
I|C|Arithmetische Zusammenhänge durch systematisches Variieren von Zahlen, Stellenwerten und Operationen erforschen und Beobachtungen festhalten
I|D|Arithmetische Zusammenhänge erforschen, Strukturen auf andere Zahlbeispiele übertragen und Beobachtungen festhalten
A|M1.2|Gebrochene Zahlen
C|1.2.1|Flexibel zählen, rationale Zahlen nach der Grösse ordnen und Brüche darstellen|M&D,O&B
I|A|Zahlen mit Komma lesen, schreiben und ordnen
I|A|In Schritten vorwärts und rückwärts zählen
I|B|Brüche mit den Nennern 2, 3, 4, 5, 6, 8, 10, 12, 20, 50, 100 ordnen und auf dem Zahlenstrahl einzeichnen
I|C|positive und negative Zahlen auf dem Zahlenstrahl ordnen
I|D|Potenzen mit natürlichem Exponenten lesen, schreiben und berechnen
C|1.2.2|Zahlen runden und Ergebnisse überschlagen|M&D
I|A|Zahlen mit Komma runden
I|B|Summen und Differenzen von Zahlen mit Komma überschlagen
I|C|Rechenergebnisse sinnvoll runden
I|D|Produkte und Quotienten von Zahlen mit Komma überschlagen
C|1.2.3|Mit rationalen Zahlen (Zahlen mit Komma sowie Brüchen) operieren|E&A,O&B
I|A|Zahlen bis 5 Wertziffern addieren und subtrahieren
I|B|Zahlen bis 5 Wertziffern multiplizieren und die Ergebnisse überprüfen
I|B|Brüche mit den Nennern 2, 3, 4, 5, 6, 8, 10, 20, 50, 100 kürzen, erweitern, addieren und subtrahieren
I|C|Brüche mit den Nennern 2, 3, 4, 5, 6, 8, 10, 12, 20, 50, 100 multiplizieren
I|D|Grundoperationen mit rationalen Zahlen ausführen und durch Umkehroperationen überprüfen
C|1.2.4|Rationale Zahlen darstellen, in andere Schreibweisen übertragen sowie Muster und Zahlenfolgen beschreiben|E&A,M&D
I|A|Brüche darstellen und vergleichen sowie Darstellungen interpretieren
I|B|Brüche (Nenner 2, 3, 4, 5, 6, 8, 10, 20, 50, 100, 1'000), Zahlen mit Komma und Prozentzahlen je in die beiden anderen Schreibweisen übertragen
I|B|Summen und Differenzen von gebrochenen Zahlen darstellen
I|C|Zahlenfolgen mit positiven rationalen Zahlen beschreiben. Eigenschaften von rationalen Zahlen erforschen und beschreiben
I|C|Produkte von gebrochenen Zahlen darstellen
I|D|Anzahl Nachkommastellen bei Produkten und Quotienten von Zahlen mit Komma erforschen und begründen
A|M1.3|Algebra (Terme und Gleichungen)
C|1.3.1|Terme vergleichen und umformen, Gesetze und Regeln anwenden, mit Variablen operieren|O&B
I|A|Zahlenterme mit Klammern auswerten
I|B|Zahlenterme mit Klammern und Grundoperationen (Punkt vor Strich) berechnen
I|C|Terme mit Variablen addieren und subtrahieren
I|D|Terme mit Variablen umformen bzw. sinnvoll vereinfachen (z.B. Terme mit Binomen)
I|D|Grundoperationen mit Variablen und Brüchen ausführen
I|E|Terme mit Potenzen und Quadratwurzeln umformen und berechnen
C|1.3.2|Gleichungen lösen, aufstellen und deuten|M&D,O&B
I|A|Gleichwertigkeit von zwei Zahlentermen überprüfen
I|B|Gleichungen mit einer Variablen durch Einsetzen oder Umkehroperationen lösen und überprüfen
I|C|lineare Gleichungen mit einer Variablen mit Äquivalenzumformungen lösen und überprüfen
I|D|Gleichungen sprachlich deuten und zu Texten Gleichungen finden
I|E|Quadratische Gleichungen durch Faktorzerlegung lösen
I|E|Bruchgleichungen lösen
C|1.3.3|Anzahlen, Zahlenfolgen und Terme veranschaulichen und verallgemeinern|E&A,M&D
I|A|Figurenfolgen und arithmetische Muster weiterführen
I|B|zu Figurenfolgen oder arithmetischen Mustern Gesetzmässigkeiten formulieren
I|C|Arithmetische und algebraische Terme veranschaulichen, insbesondere mit Text, Symbolen und Skizzen
I|D|Terme geometrisch interpretieren
I|D|Lineare Figurenfolgen in einen Term übertragen
I|E|Zahlen und Operationen in Buchstabentermen systematisch variieren
I|E|Wachstum in Termen, Zahlenfolgen und Graphen erkennen und beschreiben
T|M2|Form und Raum
A|M2.1|Geometrie der Ebene
C|2.1.1|Mit Zirkel, Geodreieck und Lineal konstruieren, Figuren in der Ebene abbilden, zerlegen und zusammenfügen|M&D,O&B
I|A|Skizzen und Zeichnungen nachvollziehen sowie mit Rastern, Zirkel und Geodreieck (Kreise, Parallelen, Rechtewinkel, Strecken) zeichnen
I|B|Winkel übertragen, messen und konstruieren
I|B|Figuren mit dem Geodreieck konstruieren, zerlegen, zusammenfügen und deren Grösse ändern
I|C|Winkelhalbierende, Mittelsenkrechte und einfache Figuren korrekt beschriften sowie mit Geodreieck und Zirkel konstruieren
I|C|Figuren spiegeln (Punktspiegelung, Achsenspiegelung) und verschieben und entsprechende Abbildungen erkennen
I|D|Figuren mit Zirkel und Geodreieck drehen
I|E|Figuren bei gegebenem Streckfaktor und Streckzentrum strecken
C|2.1.2|Längen, Winkel und Flächeninhalte an Drei-, Vierecken und Kreisfiguren bestimmen und Berechnungen ausführen|O&B
I|A|den Umfang von Vielecken messen, auszählen und berechnen sowie den Flächeninhalt von Quadraten und Rechtecken berechnen

// === KERN (fachunabhängig) ===
// Modelle: Subject · Competency · Item · LearningModule · Template (Aufgabenvorlage) · EducationTrack · UserProgress
// Der Kern kennt keine Mathematik: Fächer werden als «Subject» registriert (Raster-Text + Plugin mit Modulen, Vorlagen, Vokabular).
const mulberry32 = a => () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const ri = (r, a, b) => a + Math.floor(r() * (b - a + 1));
const pick = (r, arr) => arr[Math.floor(r() * arr.length)];
const rnd = (x, d = 2) => Math.round(x * 10 ** d) / 10 ** d;
const gcd = (a, b) => b ? gcd(b, a % b) : Math.abs(a);
const sep = i => i.replace(/\B(?=(\d{3})+(?!\d))/g, '’');
// Anzeige: Tausendertrennzeichen ’, Dezimalkomma, echtes Minuszeichen. d = feste Nachkommastellen, sonst auf 3 gerundet.
function fmt(x, d) {
  const [i0, f] = (d === undefined ? String(rnd(x, 3)) : x.toFixed(d)).split('.');
  const neg = i0.startsWith('-');
  return (neg ? '−' : '') + sep(neg ? i0.slice(1) : i0) + (f ? ',' + f : '');
}
// Wie fmt, aber ohne Rundung auf 3 Stellen (für sehr kleine/grosse Zahlen)
function fmtX(x) {
  const s = String(Number(Number(x).toPrecision(12))), neg = s[0] === '-';
  const [i, f] = (neg ? s.slice(1) : s).split('.');
  return (neg ? '−' : '') + sep(i) + (f ? ',' + f : '');
}
const slug = s => s.toLowerCase().replace(/[^a-z0-9äöüéèà]+/g, '-').replace(/^-|-$/g, '');

const SUBJECTS = [];   // Subject[]
const TRACKS = [];     // EducationTrack[]: { id, name, type: 'EFZ'|'EBA'|'BM'|'ALLG', req: { [subjectId]: Set<itemIdx> } }

// Raster-Text → Themen/Bereiche/Kompetenzen/Items (Format siehe data-*.js)
function parseRaster(subjectId, text) {
  const themes = [], comps = []; let th, ar, c, idx = 0;
  for (const line of text.split('\n')) {
    const p = line.split('|');
    if (p[0] === 'T') themes.push(th = { id: p[1], title: p[2], areas: [] });
    else if (p[0] === 'A') th.areas.push(ar = { id: p[1], title: p[2], comps: [] });
    else if (p[0] === 'C') { comps.push(c = { id: p[1], subjectId, themeId: th.id, areaId: ar.id, title: p[2], aspects: p[3] ? p[3].split(',') : [], items: [] }); ar.comps.push(c); }
    else if (p[0] === 'I') c.items.push({ idx: idx++, level: p[1], text: p.slice(2).join('|') });
  }
  return { themes, comps, itemCount: idx };
}
const maskToSet = (hex, n) => { const s = new Set(); for (let i = 0; i < n; i++) if ((parseInt(hex[i >> 2], 16) >> (3 - (i & 3))) & 1) s.add(i); return s; };

// Subject registrieren: Plugin-Definition + Raster-Text → fertiges Subject
function buildSubject(def, rasterText) {
  const r = parseRaster(def.id, rasterText);
  const subj = Object.assign({ modules: {}, compModules: {}, templates: [], vocab: [], aspects: {} }, def,
    { themes: r.themes, comps: r.comps, itemCount: r.itemCount, compById: Object.fromEntries(r.comps.map(c => [c.id, c])) });
  subj.comps.forEach(c => { c.moduleIds = subj.compModules[c.id] || []; c.plain = (subj.plain || {})[c.id] || { t: c.title, d: '', e: '' }; });
  SUBJECTS.push(subj);
  return subj;
}
// Berufe/Schulen (EducationTrack) für ein Subject einlesen; Zeile = Typ|Maske|Name. Gleiche Tracks werden über Typ+Name zusammengeführt.
function addTracks(subj, text) {
  for (const line of text.split('\n')) {
    const [type, hex, ...rest] = line.split('|'), name = rest.join('|');
    let t = TRACKS.find(x => x.name === name && x.type === type);
    if (!t) {
      let id = slug(name), k = 2; while (TRACKS.some(x => x.id === id)) id = slug(name) + '-' + k++;
      TRACKS.push(t = { id, name, type, req: {} });
    }
    t.req[subj.id] = maskToSet(hex, subj.itemCount);
  }
  TRACKS.sort((a, b) => a.name.localeCompare(b.name, 'de'));
}
// Tracks aus Definitionen (z. B. Schulen): caps = höchste Stufe pro Kompetenz (def für den Rest), ex = ausgeschlossene Item-Nummern
function addTrackDefs(subj, defs) {
  defs.forEach(d => {
    const set = new Set(), ex = new Set(d.ex || []);
    subj.comps.forEach(c => { const cap = (d.caps || {})[c.id] || d.def || 'C'; c.items.forEach(i => { if (i.level <= cap && !ex.has(i.idx)) set.add(i.idx); }); });
    let id = slug(d.short || d.name), k = 2; while (TRACKS.some(x => x.id === id)) id = slug(d.short || d.name) + '-' + k++;
    TRACKS.push({ id, name: d.name, short: d.short, type: d.type, exam: d.exam, ord: defs.indexOf(d), req: { [subj.id]: set } });
  });
  TRACKS.sort((a, b) => a.name.localeCompare(b.name, 'de'));
}
// Fallback für Berufe ohne Raster: alle Items bis Stufe C gelten als gefordert
function genericTrack(name) {
  const t = { id: 'allgemein', name, type: 'ALLG', req: {} };
  SUBJECTS.forEach(s => { t.req[s.id] = new Set(s.comps.flatMap(c => c.items.filter(i => i.level <= 'C').map(i => i.idx))); });
  return t;
}

// Anforderung eines Tracks an eine Kompetenz: welche Stufen/Items sind gefordert («Pflicht», grün im BKD-Raster)?
function compReq(track, subj, comp) {
  const set = (track.req || {})[subj.id] || new Set(), levels = new Set(); let count = 0;
  comp.items.forEach(i => { if (set.has(i.idx)) { levels.add(i.level); count++; } });
  return { levels, count };
}
// Lernpfad: standardmässig alle Kompetenzen mit gefordertem Item; sonst (kein Raster-Eintrag) alle
function defaultPath(track, subj) {
  const need = subj.comps.filter(c => compReq(track, subj, c).count > 0).map(c => c.id);
  return need.length ? need : subj.comps.map(c => c.id);
}

// Aufgabenvorlagen (Templates) – keine Laufzeit-KI: deterministisch aus Seed erzeugt, gleiche Seed = gleiche Aufgabe
const templatesFor = (subj, comp, levels) => subj.templates.filter(t => t.comps.includes(comp.id) && (!levels || !levels.size || levels.has(t.level))).sort((a, b) => a.level.localeCompare(b.level));
function vocabFor(subj, trackName) {
  const n = (trackName || '').toLowerCase();
  return subj.vocab.find(v => v.m && v.m.test(n)) || subj.vocab.find(v => v.id === 'allgemein') || subj.vocab[0];
}
const tidy = t => typeof t === 'string' ? t.replace(/(?<!\.)\.\.(?!\.)/g, '.').replace(/(^|[\s(·:=])-(?=\d)/g, '$1−').replace(/ {2,}/g, ' ') : t; // «Fr..» → «Fr.»
function makeExercise(tpl, vocab, seed) { const ex = Object.assign({ seed, tpl: tpl.id }, tpl.gen(vocab, mulberry32(seed))); ex.q = tidy(ex.q); if (ex.sol) ex.sol = ex.sol.map(tidy); return ex; }
// Übungsset: n Aufgaben, reihum über die passenden Vorlagen (Runde verschiebt Start und Seeds)
function practiceSet(subj, comp, levels, vocab, round, n = 5) {
  const el = templatesFor(subj, comp, levels); if (!el.length) return [];
  let h = 0; for (const ch of comp.id) h = (h * 31 + ch.charCodeAt(0)) % 9973;
  return Array.from({ length: n }, (_, i) => makeExercise(el[(i + round - 1) % el.length], vocab, 1000 * round + i * 37 + h));
}

// Eingabe prüfen: akzeptiert 12,5 | 12.5 | 3/8 | 1’200
const UFRAC = { '½': '1/2', '¼': '1/4', '¾': '3/4', '⅓': '1/3', '⅔': '2/3', '⅕': '1/5', '⅛': '1/8', '⅒': '1/10' };
// Tolerant: akzeptiert Tausendertrenner (1’500, 1 500), Komma/Punkt, Brüche (3/8, 1½), «+», Minuszeichen (− –), Vorsilben (x=, CHF, Fr.) und angehängte Einheiten (12 cm, 15 %, 1500.–)
function parseAnswer(s) {
  s = String(s).trim().replace(/[−–—]/g, '-').replace(/^(x|y|z|a|b|c)\s*=\s*/i, '').replace(/^(CHF|Fr\.?)\s*/i, '');
  s = s.replace(/(\d)\s*([½¼¾⅓⅔⅕⅛⅒])/g, (m, d, f) => d + '+' + UFRAC[f]).replace(/[½¼¾⅓⅔⅕⅛⅒]/g, f => UFRAC[f]);
  s = s.replace(/[’'\s]/g, '').replace(',', '.');
  if (!s) return NaN;
  const mixed = s.match(/^([-+]?)(\d+)\+(\d+)\/(\d+)$/); if (mixed) { const v = Number(mixed[2]) + Number(mixed[3]) / Number(mixed[4]); return mixed[1] === '-' ? -v : v; }
  const m = s.match(/^([-+]?\d+(?:\.\d+)?(?:\/\d+(?:\.\d+)?)?)\.?(?:[-–]{1,2})?(?:%|‰|[A-Za-zäöüÄÖÜµ°²³\/·.]*|Fr\.?)$/);
  if (!m) return NaN;
  const t = m[1].replace(/^\+/, '');
  if (t.includes('/')) { const [x, y] = t.split('/').map(Number); return y ? x / y : NaN; }
  return Number(t);
}
// Aufgabenformen (Rückgabe der Vorlage): 
//  Zahl:      {q, a, unit, tol?, sol}
//  Auswahl:   {q, opts:[text…], a: Index der richtigen Option, sol}
//  Mehrfeld:  {q, fields:[{l, a, unit?, tol?}], sol}   (Tabelle / Teilaufgaben a, b, c)
//  Optional bei allen: svg (Diagramm/Plan als SVG-Text)
function checkField(f, input) {
  const v = parseAnswer(input); if (isNaN(v)) return false;
  return Math.abs(v - f.a) <= (f.tol !== undefined ? f.tol : 0.0051) + 1e-9;
}

function hintFor(f, input) {
  const v = parseAnswer(input), a = f.a; if (isNaN(v) || a === undefined) return '';
  if (a !== 0 && Math.abs(v + a) < 1e-9 + Math.abs(a) * 1e-6) return 'Prüfe das Vorzeichen (plus oder minus).';
  if (a !== 0 && v !== 0) { const r = Math.abs(v / a), lg = Math.log10(r); if (Math.abs(lg - Math.round(lg)) < 1e-6 && Math.round(lg) !== 0) return 'Die Zahl stimmt, aber das Komma oder die Einheit nicht: Prüfe die Umrechnung (Faktor 10, 100, 1’000).'; }
  if (a !== 0 && Math.abs(v - a) / Math.abs(a) < 0.06) return 'Du bist ganz nah dran. Prüfe das Runden oder einen kleinen Rechenfehler.';

function checkExercise(ex, inputs) {
  const k = exKind(ex);
  if (k === 'opts') return [Number(inputs) === ex.a];
  if (k === 'fields') return ex.fields.map((f, i) => checkField(f, (inputs || [])[i] || ''));

function answerText(ex) {

}

function shuffleOpts(r, opts) {
  const idx = opts.map((_, i) => i); for (let i = idx.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; }
  return { opts: idx.map(i => opts[i]), a: idx.indexOf(0) };
}

const NOUN_GENDER = { Plakatwand: 'f', Farbbehälter: 'm', Werkbank: 'f', Brennofen: 'm', Bodenfläche: 'f', Putzeimer: 'm', Perronfläche: 'f', Badezimmerwand: 'f', Tischplatte: 'f', Schaltschrankwand: 'f', Behandlungsliege: 'f', Verkaufsfläche: 'f', Backblech: 'n', Mauer: 'f', Büroraum: 'm', Motorhaube: 'f', Werkstückplatte: 'f', Serverraumboden: 'm', Arbeitsplatte: 'f', Rasenfläche: 'f', Zimmerwand: 'f', Lagerfläche: 'f', Fläche: 'f',
  Boiler: 'm', Lackbehälter: 'm', Kabelkanal: 'm', Wassertank: 'm', Lagerbehälter: 'm', Vorratstank: 'm', Betonmischer: 'm', Farbtank: 'm', Öltank: 'm', Kühlmitteltank: 'm', Kühlwassertank: 'm', Regenfass: 'n', Farbkübel: 'm', Container: 'm', Behälter: 'm' };
// k: 'd' = Der/Die/Das X · 'a' = den/die/das X (Akkusativ, klein) · 'i' = Ein/Eine X · 'c' = Ein zylindrischer/zylindrische/zylindrisches X
function art(noun, k) {
  const g = NOUN_GENDER[noun] || 'f';
  const t = { d: { m: 'Der', f: 'Die', n: 'Das' }, a: { m: 'den', f: 'die', n: 'das' }, i: { m: 'Ein', f: 'Eine', n: 'Ein' }, c: { m: 'Ein zylindrischer', f: 'Eine zylindrische', n: 'Ein zylindrisches' } };
  return t[k][g] + ' ' + noun;
}
// Pronomen zum Subjekt «Die Temperatur …», «Das Kontoguthaben …», «Der Kontostand …»
const pro = n => ({ m: 'er', f: 'sie', n: 'es' }[NOUN_GENDER[n] || 'f']);
const poss = n => ({ m: 'seine', f: 'ihre', n: 'seine' }[NOUN_GENDER[n] || 'f']);
const pron = s => ({ Die: 'sie', Das: 'es', Der: 'er' }[(s || '').split(' ')[0]] || 'es');

// === FACH-PLUGIN Mathematik, Teil 2: Aufgabenvorlagen «Zahl und Variable» (Bereich M1) ===
// Jede Vorlage: T(id, [Kompetenzen], Stufe, (p, r) => {q, a, unit, sol[], tol?}). p = Berufs-Vokabular, r = Zufall (Seed).
// Vorlagen sind eigene, gleichwertig gebaute Aufgaben – keine Übernahme aus Lehrmitteln.
const MATH_TEMPLATES = [];
const T = (id, comps, level, gen) => MATH_TEMPLATES.push({ id, comps: [].concat(comps), level, gen });
const price = (p, r) => Math.max(0.05, rnd(Math.round((p.pr[0] + r() * (p.pr[1] - p.pr[0])) / 0.05) * 0.05));
const divisors = n => { const d = []; for (let i = 1; i <= n; i++) if (n % i === 0) d.push(i); return d; };

// --- 1.1.1 Operieren mit ganzen Zahlen

T('zz-ueberschlag', '1.1.1', 'B', (p, r) => { const x = ri(r, 1200, 9800), y = ri(r, 1200, 9800), z = ri(r, 1200, 9800); const f = v => Math.round(v / 100) * 100; return { q: `Es werden ${fmt(x)}, ${fmt(y)} und ${fmt(z)} ${p.obj} bestellt. Überschlage die Gesamtmenge: Runde jede Zahl auf Hunderter und addiere.`, a: f(x) + f(y) + f(z), unit: 'Stück', sol: [`${fmt(f(x))} + ${fmt(f(y))} + ${fmt(f(z))}`, `= ${fmt(f(x) + f(y) + f(z))}`] }; });
T('zz-rest', '1.1.1', 'C', (p, r) => { const k = pick(r, [3, 4, 6, 8, 9]), n = ri(r, 40, 200) * k + ri(r, 1, k - 1); return { q: `Du packst ${n} ${p.obj} in Kisten zu je ${k} Stück. Wie viele ${p.obj} bleiben übrig, wenn du nur volle Kisten packst?`, a: n % k, unit: 'Stück', sol: [`${n} : ${k} = ${Math.floor(n / k)} Rest ${n % k}`, `Es bleiben ${n % k} übrig.`] }; });
T('zz-teiler', '1.1.1', 'C', (p, r) => { const n = pick(r, [12, 18, 20, 24, 28, 30, 36, 45, 48, 60]); return { q: `Wie viele Teiler hat die Zahl ${n}? (1 und ${n} zählen mit)`, a: divisors(n).length, unit: '', sol: [`Teiler von ${n}: ${divisors(n).join(', ')}`, `Anzahl: ${divisors(n).length}`] }; });
T('zz-ganze', '1.1.1', 'D', (p, r) => { const chf = p.neg.unit === 'Fr.'; const st = chf ? 50 : 1, m = chf ? 30 : 15; let a = ri(r, -m, m) * st, b = ri(r, -m, m) * st; if (a === b) b += 5 * st; return { q: `${p.neg.s} verändert sich von ${fmt(a)} ${p.neg.unit} auf ${fmt(b)} ${p.neg.unit}. Wie gross ist die Veränderung (mit Vorzeichen)?`, a: b - a, unit: p.neg.unit, sol: ['Veränderung = Endwert − Anfangswert', `${fmt(b)} − (${fmt(a)}) = ${fmt(b - a)}`] }; });
T('zz-ganze2', '1.1.1', 'D', (p, r) => { const chf = p.neg.unit === 'Fr.'; const st = chf ? 100 : 1; const s = ri(r, -8, 6) * st, x = ri(r, 3, 12) * st, y = ri(r, 3, 12) * st, z = ri(r, 2, 9) * st; const e = s + x - y - z; return { q: `${p.neg.s} beträgt am Morgen ${fmt(s)} ${p.neg.unit}. Bis am Mittag steigt ${pron(p.neg.s)} um ${fmt(x)}, am Nachmittag sinkt ${pron(p.neg.s)} um ${fmt(y)} und am Abend nochmals um ${fmt(z)} (jeweils ${p.neg.unit}). Wie gross ist der Wert am Abend?`, a: e, unit: p.neg.unit, sol: [`${fmt(s)} + ${fmt(x)} − ${fmt(y)} − ${fmt(z)}`, `= ${fmt(e)}`] }; });
T('zz-primfaktor', '1.1.1', 'E', (p, r) => { const ps = [2, 3, 5, 7, 11, 13]; const f = [pick(r, [2, 3]), pick(r, [2, 3, 5]), pick(r, ps.slice(2))].sort((a, b) => a - b); const n = f[0] * f[1] * f[2]; return { q: `Zerlege ${n} in Primfaktoren. Wie heisst der grösste Primfaktor?`, a: f[2], unit: '', sol: [`${n} = ${f.join(' · ')}`, `Grösster Primfaktor: ${f[2]}`] }; });

// --- 1.3.1 Terme
T('te-klammer', '1.3.1', 'A', (p, r) => { const a = ri(r, 2, 15), b = ri(r, 2, 15), c = ri(r, 2, 9); return { q: `Berechne (${a} + ${b}) · ${c}.`, a: (a + b) * c, unit: '', sol: [`Klammer zuerst: ${a} + ${b} = ${a + b}`, `${a + b} · ${c} = ${(a + b) * c}`] }; });
T('te-punkt', '1.3.1', 'B', (p, r) => { const a = ri(r, 10, 40), b = ri(r, 2, 9), c = ri(r, 2, 9), d = ri(r, 2, 9); return { q: `Berechne ${a} + ${b} · (${c} + ${d}).`, a: a + b * (c + d), unit: '', sol: [`Klammer: ${c} + ${d} = ${c + d}`, `Punkt vor Strich: ${b} · ${c + d} = ${b * (c + d)}`, `${a} + ${b * (c + d)} = ${a + b * (c + d)}`] }; });
T('te-variablen', '1.3.1', 'C', (p, r) => { const a = ri(r, 2, 9), b = ri(r, 2, 9), c = ri(r, 2, 9), d = ri(r, 1, 8), x = ri(r, 2, 8); return { q: `Vereinfache ${a}x + ${c} + ${b}x − ${d} und setze dann x = ${x} ein. Wie gross ist der Wert?`, a: (a + b) * x + c - d, unit: '', sol: [`${a}x + ${b}x = ${a + b}x und ${c} − ${d} = ${c - d}`, `Term: ${a + b}x ${c - d >= 0 ? '+' : '−'} ${Math.abs(c - d)}`, `x = ${x}: ${a + b} · ${x} ${c - d >= 0 ? '+' : '−'} ${Math.abs(c - d)} = ${(a + b) * x + c - d}`] }; });
T('te-binom', '1.3.1', 'D', (p, r) => { const a = ri(r, 2, 9); return { q: `(x + ${a})² wird ausmultipliziert zu x² + c · x + ${a * a}. Wie gross ist c?`, a: 2 * a, unit: '', sol: [`(x + ${a})² = x² + 2 · ${a} · x + ${a}²`, `c = 2 · ${a} = ${2 * a}`] }; });
T('te-bruch', '1.3.1', 'D', (p, r) => { const [a, b] = pick(r, [[4, 6], [2, 3], [3, 6], [4, 12], [6, 4]]); const m = a * b / gcd(a, b); const x = m * ri(r, 1, 4); return { q: `Berechne x/${a} + x/${b} für x = ${x}.`, a: x / a + x / b, unit: '', sol: [`${x} : ${a} = ${fmt(x / a)}`, `${x} : ${b} = ${fmt(x / b)}`, `Summe: ${fmt(x / a + x / b)}`] }; });
T('te-wurzel', '1.3.1', 'E', (p, r) => { const a = ri(r, 2, 9), w = pick(r, [4, 9, 16, 25, 36, 49]), e = ri(r, 2, 5); return { q: `Berechne ${a} · √${w} − ${e}².`, a: a * Math.sqrt(w) - e * e, unit: '', sol: [`√${w} = ${Math.sqrt(w)}, ${e}² = ${e * e}`, `${a} · ${Math.sqrt(w)} − ${e * e} = ${fmt(a * Math.sqrt(w) - e * e)}`] }; });

// --- 1.3.2 Gleichungen
T('gl-gleich', '1.3.2', 'A', (p, r) => { const a = ri(r, 2, 9), b = ri(r, 2, 9), c = ri(r, 2, 9), ok = r() < 0.5, d = ok ? a * b + c : a * b + c + ri(r, 1, 3); return { q: `Gilt ${a} · ${b} + ${c} = ${d}? Antworte mit 1 für „stimmt“ und 0 für „stimmt nicht“.`, a: ok ? 1 : 0, unit: '', sol: [`Linke Seite: ${a} · ${b} + ${c} = ${a * b + c}`, `Rechte Seite: ${d}`, ok ? 'Beide Seiten sind gleich → stimmt (1).' : 'Die Seiten sind verschieden → stimmt nicht (0).'] }; });
T('gl-umkehr', '1.3.2', 'B', (p, r) => { const x = ri(r, 4, 40), k = ri(r, 5, 30); return { q: `Auf einer Palette liegen x ${p.obj}. Es werden ${k} weitere dazugelegt, jetzt sind es ${x + k}. Löse x + ${k} = ${x + k}.`, a: x, unit: 'Stück', sol: [`Umkehroperation: Subtraktion`, `x = ${x + k} − ${k} = ${x}`] }; });
T('gl-rechnung', '1.3.2', 'C', (p, r) => { const G = ri(r, 4, 12) * 10, s = ri(r, 4, 14) * 10, x = ri(r, 2, 9), Tt = G + s * x; return { q: `Ein Betrieb verrechnet für einen Einsatz Fr. ${G} Anfahrt plus Fr. ${s} pro Arbeitsstunde. Die Rechnung beträgt Fr. ${Tt}. Wie viele Stunden wurden gearbeitet?`, a: x, unit: 'h', sol: [`${G} + ${s} · x = ${Tt}`, `${s} · x = ${Tt} − ${G} = ${Tt - G}`, `x = ${Tt - G} : ${s} = ${x}`] }; });
T('gl-lieferung', '1.3.2', 'C', (p, r) => { const x = ri(r, 8, 40), k = ri(r, 5, 25), Tt = 2 * x + k; return { q: `Zwei gleich grosse Lieferungen ${p.obj} und zusätzlich ${k} einzelne ${p.obj} ergeben zusammen ${Tt} ${p.obj}. Wie gross ist eine Lieferung?`, a: x, unit: 'Stück', sol: [`2 · x + ${k} = ${Tt}`, `2 · x = ${Tt} − ${k} = ${Tt - k}`, `x = ${Tt - k} : 2 = ${x}`] }; });
T('gl-text', '1.3.2', 'D', (p, r) => { const x = ri(r, 3, 25), m = ri(r, 2, 5), k = ri(r, 2, 15); return { q: `Das ${m}-Fache einer Zahl, vermindert um ${k}, ergibt ${m * x - k}. Stelle die Gleichung auf und löse sie. Wie heisst die Zahl?`, a: x, unit: '', sol: [`${m} · x − ${k} = ${m * x - k}`, `${m} · x = ${m * x - k} + ${k} = ${m * x}`, `x = ${m * x} : ${m} = ${x}`] }; });
T('gl-quadrat', '1.3.2', 'E', (p, r) => { const a = ri(r, 1, 6), b = ri(r, a + 1, 9); return { q: `Löse x² − ${a + b}x + ${a * b} = 0 durch Faktorzerlegung. Wie lautet die grössere Lösung?`, a: b, unit: '', sol: [`Zwei Zahlen mit Produkt ${a * b} und Summe ${a + b}: ${a} und ${b}`, `(x − ${a}) · (x − ${b}) = 0`, `x = ${a} oder x = ${b} → die grössere Lösung ist ${b}`] }; });
T('gl-bruch', '1.3.2', 'E', (p, r) => { const [a, b] = pick(r, [[2, 3], [3, 4], [2, 5], [3, 6], [4, 5]]), x = (a + b) * ri(r, 1, 4) * (a * b / gcd(a, b)) / (a * b / gcd(a, b)); const c = x / a + x / b; return { q: `Löse die Gleichung x/${a} + x/${b} = ${fmt(c, 3)}.`, a: x, tol: 0.01, unit: '', sol: [`Gemeinsamer Nenner ${a * b}: (${b}x + ${a}x)/${a * b} = ${fmt(c, 3)}`, `${a + b}x = ${fmt(c * a * b, 3)}`, `x = ${fmt(x)}`] }; });

// --- 1.3.3 Anzahlen, Folgen und Terme veranschaulichen
T('fi-hoelzer', '1.3.3', 'A', (p, r) => { const n = ri(r, 5, 12); return { q: `Für ein Quadrat braucht man 4 Hölzchen. Legt man Quadrate in einer Reihe nebeneinander, teilen sich benachbarte Quadrate ein Hölzchen: 2 Quadrate brauchen 7, 3 Quadrate brauchen 10 Hölzchen. Wie viele Hölzchen braucht eine Reihe aus ${n} Quadraten?`, a: 3 * n + 1, unit: 'Stück', sol: ['Jedes weitere Quadrat braucht 3 Hölzchen mehr: 4, 7, 10, 13, …', `Regel: 3 · n + 1 → 3 · ${n} + 1 = ${3 * n + 1}`] }; });
T('fi-zuwachs', '1.3.3', 'B', (p, r) => { const a = ri(r, 2, 8), d = ri(r, 2, 6); return { q: `Figur 1 hat ${a} Punkte, Figur 2 hat ${a + d}, Figur 3 hat ${a + 2 * d}. Um wie viele Punkte wächst die Figur von Schritt zu Schritt?`, a: d, unit: 'Punkte', sol: [`${a + d} − ${a} = ${d}`, `${a + 2 * d} − ${a + d} = ${d}`] }; });
T('fi-flaeche', '1.3.3', 'C', (p, r) => { const k = ri(r, 2, 5), x = ri(r, 3, 9); return { q: `Ein Rechteck hat die Seiten x und x + ${k} (in cm). Der Flächenterm lautet x · (x + ${k}). Wie gross ist die Fläche für x = ${x}?`, a: x * (x + k), unit: 'cm²', sol: [`${x} · (${x} + ${k}) = ${x} · ${x + k}`, `= ${x * (x + k)} cm²`] }; });
T('fi-term', '1.3.3', 'D', (p, r) => { const d = ri(r, 2, 6), a = ri(r, 1, 5), n = ri(r, 15, 40); return { q: `Eine Figurenfolge hat in Figur 1 genau ${a + d} ${p.obj}, in Figur 2 genau ${a + 2 * d} und in Figur 3 genau ${a + 3 * d}. Stelle den Term für Figur n auf und berechne Figur ${n}.`, a: d * n + a, unit: 'Stück', sol: [`Zuwachs ${d} pro Figur → Term: ${d} · n + ${a}`, `n = ${n}: ${d} · ${n} + ${a} = ${d * n + a}`] }; });
T('fi-wachstum', '1.3.3', 'E', (p, r) => { const s = ri(r, 2, 9), t = ri(r, 4, 8); return { q: `Eine Bakterienkultur verdoppelt sich jeden Tag. Zu Beginn sind es ${s} Einheiten. Wie viele Einheiten sind es nach ${t} Tagen?`, a: s * 2 ** t, unit: '', sol: [`Nach ${t} Tagen: ${s} · 2^${t}`, `${s} · ${2 ** t} = ${fmt(s * 2 ** t)}`] }; });

// === FACH-PLUGIN Mathematik, Teil 3: Aufgabenvorlagen «Form und Raum» (M2) und «Grössen, Funktionen und Daten» (M3) ===
const PI = 3.14;
// --- 2.1.1 Konstruieren, Figuren abbilden
T('ko-raster', '2.1.1', 'A', (p, r) => { const k = pick(r, [0.5, 1, 2]), n = ri(r, 8, 30); return { q: `Auf einem Zeichenraster entspricht ein Häuschen ${fmt(k, 1)} cm. Eine Strecke ist ${n} Häuschen lang. Wie lang ist sie in cm?`, a: n * k, unit: 'cm', sol: [`${n} · ${fmt(k, 1)}`, `= ${fmt(n * k, 1)} cm`] }; });
T('ko-winkel', '2.1.1', 'B', (p, r) => { const a = ri(r, 20, 160); return { q: `Zwei Winkel liegen nebeneinander auf einer Geraden (gestreckter Winkel, 180°). Der eine misst ${a}°. Wie gross ist der andere?`, a: 180 - a, unit: '°', sol: ['Gestreckter Winkel = 180°', `180° − ${a}° = ${180 - a}°`] }; });
T('ko-halbierende', '2.1.1', 'C', (p, r) => { const a = ri(r, 11, 85) * 2; return { q: `Ein Winkel von ${a}° wird mit Zirkel und Geodreieck halbiert (Winkelhalbierende). Wie gross ist jeder Teilwinkel?`, a: a / 2, unit: '°', sol: [`${a}° : 2 = ${a / 2}°`] }; });
T('ko-spiegel', '2.1.1', 'C', (p, r) => { const x = ri(r, 1, 9), y = ri(r, 1, 9); return { q: `Der Punkt P(${x} | ${y}) wird an der y-Achse gespiegelt. Wie lautet die x-Koordinate des Bildpunkts P'?`, a: -x, unit: '', sol: ['Spiegelung an der y-Achse: x wechselt das Vorzeichen, y bleibt.', `P'(${fmt(-x)} | ${y}) → x = ${fmt(-x)}`] }; });
T('ko-drehen', '2.1.1', 'D', (p, r) => { const x = ri(r, 1, 9), y = ri(r, 1, 9); return { q: `Der Punkt P(${x} | ${y}) wird um den Ursprung um 90° gegen den Uhrzeigersinn gedreht. Wie lautet die x-Koordinate des Bildpunkts?`, a: -y, unit: '', sol: ['Drehung um 90° gegen den Uhrzeigersinn: (x | y) → (−y | x)', `P'(${fmt(-y)} | ${x}) → x = ${fmt(-y)}`] }; });
T('ko-strecken', '2.1.1', 'E', (p, r) => { const k = pick(r, [1.5, 2, 2.5, 3]), l = ri(r, 4, 16); return { q: `Eine Figur wird mit dem Streckfaktor ${fmt(k, 1)} vergrössert. Eine Strecke misst ${l} cm. Wie lang ist sie im Bild?`, a: k * l, unit: 'cm', sol: [`Länge im Bild = Streckfaktor · Länge`, `${fmt(k, 1)} · ${l} = ${fmt(k * l, 1)} cm`] }; });

// --- 2.1.2 Längen, Winkel, Flächen
T('fl-rechteck', '2.1.2', 'A', (p, r) => { const l = ri(r, 12, 60) / 10, b = ri(r, 8, 30) / 10; return { q: `${art(p.area, 'd')} ist ${fmt(l, 1)} m lang und ${fmt(b, 1)} m breit. Wie gross ist die Fläche?`, a: rnd(l * b), unit: 'm²', sol: ['A = l · b', `${fmt(l, 1)} · ${fmt(b, 1)} = ${fmt(l * b, 2)} m²`] }; });
T('fl-umfang', '2.1.2', 'A', (p, r) => { const l = ri(r, 12, 60) / 10, b = ri(r, 8, 30) / 10; return { q: `Rund um ${art(p.area, 'a')} (${fmt(l, 1)} m × ${fmt(b, 1)} m) wird ${p.len} verlegt. Wie lang ist die Strecke?`, a: rnd(2 * (l + b)), unit: 'm', sol: ['U = 2 · (l + b)', `2 · (${fmt(l, 1)} + ${fmt(b, 1)}) = ${fmt(2 * (l + b), 1)} m`] }; });
T('fl-raster', '2.1.2', 'B', (p, r) => { const g = ri(r, 10, 30), h = ri(r, 3, 12) * 2; return { q: `Eine unregelmässige Fläche deckt auf einem Raster ${g} ganze und ${h} halbe Häuschen ab (1 Häuschen = 1 cm²). Wie gross ist die Fläche ungefähr?`, a: g + h / 2, unit: 'cm²', sol: [`${h} halbe Häuschen = ${h / 2} ganze`, `${g} + ${h / 2} = ${g + h / 2} cm²`] }; });
T('fl-winkel', '2.1.2', 'C', (p, r) => { const a = ri(r, 30, 80), b = ri(r, 30, 80); return { q: `In einem Dreieck sind zwei Winkel ${a}° und ${b}° gross. Wie gross ist der dritte Winkel?`, a: 180 - a - b, unit: '°', sol: ['Winkelsumme im Dreieck: 180°', `180° − ${a}° − ${b}° = ${180 - a - b}°`] }; });
T('fl-pythagoras', '2.1.2', 'C', (p, r) => { const [a, b, c] = pick(r, [[3, 4, 5], [6, 8, 10], [5, 12, 13], [8, 15, 17], [9, 12, 15]]), k = pick(r, [1, 10, 20]); return { q: `Eine Leiter lehnt an einer Wand. Der Fuss steht ${fmt(a * k / 10)} m von der Wand entfernt, die Leiter reicht ${fmt(b * k / 10)} m hoch. Wie lang ist die Leiter?`, a: c * k / 10, unit: 'm', sol: ['Satz des Pythagoras: c² = a² + b²', `c² = ${fmt(a * k / 10)}² + ${fmt(b * k / 10)}² = ${fmt((c * k / 10) ** 2, 2)}`, `c = ${fmt(c * k / 10)} m`] }; });
T('fl-dreieck', '2.1.2', 'C', (p, r) => { const g = ri(r, 8, 40) / 2, h = ri(r, 6, 30) / 2; return { q: `Ein dreieckiges Blech hat die Grundlinie ${fmt(g, 1)} cm und die Höhe ${fmt(h, 1)} cm. Wie gross ist die Fläche?`, a: g * h / 2, unit: 'cm²', sol: ['A = g · h : 2', `${fmt(g, 1)} · ${fmt(h, 1)} : 2 = ${fmt(g * h / 2, 2)} cm²`] }; });
T('fl-kreis', '2.1.2', 'D', (p, r) => { const d = ri(r, 10, 60); return { q: `Eine runde Platte hat einen Durchmesser von ${d} cm. Wie gross ist ihre Fläche? (π = 3,14; auf ganze cm² runden)`, a: Math.round(PI * (d / 2) ** 2), tol: 1.5, unit: 'cm²', sol: [`r = ${d} : 2 = ${fmt(d / 2)} cm`, `A = r² · π = ${fmt(d / 2)}² · 3,14 = ${fmt(PI * (d / 2) ** 2, 1)} cm²`] }; });
T('fl-umfangkreis', '2.1.2', 'D', (p, r) => { const d = ri(r, 10, 80); return { q: `Um ein rundes Rohr mit ${d} mm Durchmesser wird ${p.len} gewickelt. Wie lang ist eine Windung? (π = 3,14; auf 1 mm runden)`, a: Math.round(PI * d), tol: 1.2, unit: 'mm', sol: ['U = d · π', `${d} · 3,14 = ${fmt(PI * d, 1)} mm`] }; });
T('fl-trapez', '2.1.2', 'D', (p, r) => { const a = ri(r, 6, 20), c = ri(r, 3, 12), h = ri(r, 4, 10) * 2; return { q: `${art(p.area, 'i')} hat die Form eines Trapezes mit den parallelen Seiten ${a} dm und ${c} dm. Der Abstand der Seiten beträgt ${h} dm. Wie gross ist die Fläche?`, a: (a + c) * h / 2, unit: 'dm²', sol: ['A = (a + c) · h : 2', `(${a} + ${c}) · ${h} : 2 = ${fmt((a + c) * h / 2)} dm²`] }; });
T('fl-sektor', '2.1.2', 'E', (p, r) => { const R = ri(r, 4, 15), w = pick(r, [45, 60, 90, 120, 180]); return { q: `Ein Kreissektor hat den Radius ${R} cm und den Öffnungswinkel ${w}°. Wie gross ist seine Fläche? (π = 3,14; auf ganze cm² runden)`, a: Math.round(PI * R * R * w / 360), tol: 1.2, unit: 'cm²', sol: [`Ganzer Kreis: ${R}² · 3,14 = ${fmt(PI * R * R, 1)} cm²`, `Anteil: ${w}/360`, `${fmt(PI * R * R, 1)} · ${w} : 360 = ${fmt(PI * R * R * w / 360, 1)} cm²`] }; });
T('fl-ring', '2.1.2', 'E', (p, r) => { const R = ri(r, 6, 15), q = ri(r, 2, R - 2); return { q: `Eine Unterlagsscheibe hat den Aussenradius ${R} mm und den Innenradius ${q} mm. Wie gross ist ihre Fläche? (π = 3,14; auf ganze mm² runden)`, a: Math.round(PI * (R * R - q * q)), tol: 1.2, unit: 'mm²', sol: ['A = (R² − r²) · π', `(${R * R} − ${q * q}) · 3,14 = ${fmt(PI * (R * R - q * q), 1)} mm²`] }; });

// --- 2.1.3 Beziehungen erforschen
T('be-quadrat', '2.1.3', 'A', (p, r) => { const k = pick(r, [2, 3, 4]), s = ri(r, 2, 8); return { q: `Die Seitenlänge eines Quadrats (${s} cm) wird mit ${k} multipliziert. Um welchen Faktor wird die Fläche grösser?`, a: k * k, unit: '', sol: [`Alt: ${s}² = ${s * s} cm²`, `Neu: (${k * s})² = ${(k * s) ** 2} cm²`, `Faktor: ${(k * s) ** 2} : ${s * s} = ${k * k}`] }; });
T('be-rechteck', '2.1.3', 'B', (p, r) => { const l = ri(r, 4, 12), b = ri(r, 3, 9), d = ri(r, 1, 4); return { q: `Ein Rechteck ist ${l} cm lang und ${b} cm breit. Die Länge wird um ${d} cm verlängert. Um wie viele cm² wächst die Fläche?`, a: d * b, unit: 'cm²', sol: [`Alt: ${l} · ${b} = ${l * b} cm²`, `Neu: ${l + d} · ${b} = ${(l + d) * b} cm²`, `Zuwachs: ${d * b} cm²`] }; });
T('be-halb', '2.1.3', 'C', (p, r) => { const g = ri(r, 4, 14), h = ri(r, 3, 10); return { q: `Ein Rechteck mit Grundlinie ${g} cm und Höhe ${h} cm wird entlang der Diagonalen in zwei gleiche Dreiecke zerschnitten. Wie gross ist die Fläche eines Dreiecks?`, a: g * h / 2, unit: 'cm²', sol: [`Rechteck: ${g} · ${h} = ${g * h} cm²`, `Dreieck = Hälfte: ${fmt(g * h / 2, 1)} cm²`] }; });
T('be-vieleck', '2.1.3', 'D', (p, r) => { const n = ri(r, 5, 10); return { q: `Man kann ein regelmässiges ${n}-Eck von einer Ecke aus in ${n - 2} Dreiecke zerlegen. Wie gross ist die Winkelsumme im ${n}-Eck?`, a: (n - 2) * 180, unit: '°', sol: [`${n - 2} Dreiecke · 180°`, `= ${(n - 2) * 180}°`] }; });
T('be-kreis', '2.1.3', 'E', (p, r) => { const k = pick(r, [2, 3, 4, 5]); return { q: `Der Durchmesser eines Kreises wird mit ${k} multipliziert. Um welchen Faktor wächst seine Fläche?`, a: k * k, unit: '', sol: ['A = r² · π: Wird r mit k multipliziert, wird r² mit k² multipliziert.', `Faktor: ${k}² = ${k * k}`] }; });

// --- 2.1.4 Koordinaten, Pläne, Massstab
T('kp-weg', '2.1.4', 'A', (p, r) => { const a = ri(r, 5, 30) * 10, b = ri(r, 3, 20) * 10; return { q: `Auf dem Weg zur Baustelle gehst du ${a} m nach Osten, dann ${b} m nach Norden und auf demselben Weg wieder zurück zum Start. Wie lang ist der ganze Weg?`, a: 2 * (a + b), unit: 'm', sol: [`Hinweg: ${a} + ${b} = ${a + b} m`, `Hin und zurück: 2 · ${a + b} = ${2 * (a + b)} m`] }; });
T('kp-koord', '2.1.4', 'B', (p, r) => { const a = ri(r, 1, 4), b = ri(r, 1, 4), c = a + ri(r, 2, 7), d = b + ri(r, 2, 6); return { q: `Ein rechteckiges Feld hat die Ecken A(${a} | ${b}) und C(${c} | ${d}) (gegenüberliegend, Einheit: 1 m). Wie gross ist die Fläche?`, a: (c - a) * (d - b), unit: 'm²', sol: [`Breite: ${c} − ${a} = ${c - a} m`, `Höhe: ${d} − ${b} = ${d - b} m`, `A = ${c - a} · ${d - b} = ${(c - a) * (d - b)} m²`] }; });
T('kp-massstab', '2.1.4', 'C', (p, r) => { const m = pick(r, [20, 50, 100, 200]), l = ri(r, 25, 120) / 10; return { q: `Auf einem Plan im Massstab 1 : ${m} misst eine Strecke ${fmt(l, 1)} cm. Wie lang ist sie in Wirklichkeit (in m)?`, a: l * m / 100, unit: 'm', sol: [`${fmt(l, 1)} · ${m} = ${fmt(l * m, 1)} cm`, `${fmt(l * m, 1)} cm = ${fmt(l * m / 100, 2)} m`] }; });
T('kp-plan', '2.1.4', 'D', (p, r) => { const m = pick(r, [50, 100]), L = ri(r, 30, 90) / 10; return { q: `Ein Raum ist ${fmt(L, 1)} m lang. Wie lang zeichnest du ihn auf einem Plan im Massstab 1 : ${m} (in cm)?`, a: L * 100 / m, unit: 'cm', sol: [`${fmt(L, 1)} m = ${fmt(L * 100)} cm`, `${fmt(L * 100)} : ${m} = ${fmt(L * 100 / m, 1)} cm`] }; });
T('kp-flaeche', '2.1.4', 'E', (p, r) => { const m = pick(r, [50, 100, 200]), l = ri(r, 30, 90) / 10, b = ri(r, 20, 60) / 10; const L = l * m / 100, B = b * m / 100; return { q: `Auf einem Plan im Massstab 1 : ${m} misst ${art(p.area, 'a')} ${fmt(l, 1)} cm × ${fmt(b, 1)} cm. Wie gross ist die Fläche in Wirklichkeit?`, a: rnd(L * B), tol: 0.02, unit: 'm²', sol: [`Länge: ${fmt(l, 1)} · ${m} = ${fmt(l * m, 1)} cm = ${fmt(L, 2)} m`, `Breite: ${fmt(b, 1)} · ${m} = ${fmt(b * m, 1)} cm = ${fmt(B, 2)} m`, `A = ${fmt(L, 2)} · ${fmt(B, 2)} = ${fmt(rnd(L * B), 2)} m²`] }; });

// --- 2.2.x Körper
T('kr-zerlegen', ['2.2.1', '2.2.2'], 'A', (p, r) => { const k = pick(r, [2, 3]), x = ri(r, 1, 3), y = ri(r, 1, 3), z = ri(r, 1, 2); return { q: `Ein Quader misst ${x * k} cm × ${y * k} cm × ${z * k} cm. Er wird in lauter Würfel mit ${k} cm Kantenlänge zerlegt. Wie viele Würfel entstehen?`, a: x * y * z, unit: 'Stück', sol: [`In jeder Richtung: ${x}, ${y}, ${z} Würfel`, `${x} · ${y} · ${z} = ${x * y * z}`] }; });
T('kr-netz', ['2.2.1', '2.2.3'], 'B', (p, r) => { const l = ri(r, 4, 20), b = ri(r, 3, 12), h = ri(r, 2, 10); return { q: `Das Netz eines Quaders (${l} cm × ${b} cm × ${h} cm) wird aus Karton geschnitten. Wie gross ist die Fläche des Netzes?`, a: 2 * (l * b + l * h + b * h), unit: 'cm²', sol: [`Grund- und Deckfläche: 2 · ${l * b} = ${2 * l * b}`, `Vorder- und Rückseite: 2 · ${l * h} = ${2 * l * h}`, `Seitenflächen: 2 · ${b * h} = ${2 * b * h}`, `Summe: ${2 * (l * b + l * h + b * h)} cm²`] }; });
T('kr-saeulen', '2.2.1', 'C', (p, r) => { const v = [ri(r, 1, 4), ri(r, 1, 4), ri(r, 1, 4), ri(r, 1, 4)]; return { q: `Ein Körper aus Würfeln hat in der Aufsicht 2 × 2 Felder. Auf den Feldern stehen Säulen mit ${v.join(', ')} Würfeln. Wie viele Würfel sind es insgesamt?`, a: v.reduce((x, y) => x + y), unit: 'Stück', sol: [v.join(' + '), `= ${v.reduce((x, y) => x + y)}`] }; });
T('kr-flaechen', '2.2.1', 'D', (p, r) => { const n = ri(r, 3, 8); return { q: `Eine Pyramide hat als Grundfläche ein regelmässiges ${n}-Eck. Wie viele Flächen hat sie insgesamt (Grundfläche und Seitenflächen)?`, a: n + 1, unit: '', sol: [`Seitenflächen: ${n} Dreiecke`, `Dazu die Grundfläche: ${n} + 1 = ${n + 1}`] }; });
T('kr-modell', '2.2.1', 'E', (p, r) => { const m = pick(r, [10, 20, 25, 50]), L = ri(r, 2, 12); return { q: `Von einem ${L} m langen Bauteil wird ein Modell im Massstab 1 : ${m} gebaut. Wie lang ist das Modell (in cm)?`, a: L * 100 / m, unit: 'cm', sol: [`${L} m = ${L * 100} cm`, `${L * 100} : ${m} = ${fmt(L * 100 / m, 1)} cm`] }; });
T('kr-zusammen', ['2.2.1', '2.2.2'], 'B', (p, r) => { const l = ri(r, 3, 8), b = ri(r, 2, 6), h1 = ri(r, 2, 6), h2 = ri(r, 2, 6); return { q: `Zwei Quader mit gleicher Grundfläche (${l} cm × ${b} cm) und den Höhen ${h1} cm und ${h2} cm werden aufeinandergestellt. Wie gross ist das Volumen des zusammengesetzten Körpers?`, a: l * b * (h1 + h2), unit: 'cm³', sol: [`Gesamthöhe: ${h1} + ${h2} = ${h1 + h2} cm`, `V = ${l} · ${b} · ${h1 + h2} = ${l * b * (h1 + h2)} cm³`] }; });
T('kr-kippen', '2.2.2', 'A', (p, r) => { const l = ri(r, 8, 20), b = ri(r, 3, 7), h = ri(r, 2, b - 1); return { q: `Ein Quader (${l} cm lang, ${b} cm breit, ${h} cm hoch) steht flach. Er wird auf die Seite mit ${b} cm × ${h} cm gestellt (hochkant). Wie hoch ist er jetzt?`, a: l, unit: 'cm', sol: ['Die lange Kante steht nun senkrecht.', `Neue Höhe: ${l} cm`] }; });
T('kr-bemalt', '2.2.2', 'C', (p, r) => { const n = pick(r, [3, 4, 5]); return { q: `Ein Würfel mit ${n} cm Kantenlänge wird rundum bemalt und dann in ${n ** 3} Einheitswürfel (1 cm) zerlegt. Wie viele Einheitswürfel haben genau zwei bemalte Flächen?`, a: 12 * (n - 2), unit: 'Stück', sol: ['Genau zwei bemalte Flächen haben die Würfel an den Kanten (ohne Ecken).', `12 Kanten · ${n - 2} = ${12 * (n - 2)}`] }; });
T('kr-bemalt1', '2.2.2', 'D', (p, r) => { const n = pick(r, [3, 4, 5, 6]); return { q: `Ein Würfel mit ${n} cm Kantenlänge wird rundum bemalt und dann in Einheitswürfel (1 cm) zerlegt. Wie viele haben genau eine bemalte Fläche?`, a: 6 * (n - 2) ** 2, unit: 'Stück', sol: ['Genau eine bemalte Fläche haben die Würfel in der Mitte jeder Seitenfläche.', `6 Seiten · (${n - 2} · ${n - 2}) = ${6 * (n - 2) ** 2}`] }; });
T('kr-zaehlen', '2.2.3', 'A', (p, r) => { const l = ri(r, 3, 8), b = ri(r, 2, 5), h = ri(r, 2, 4); return { q: `Ein Quader wird aus Einheitswürfeln gebaut: ${l} Würfel lang, ${b} breit und ${h} hoch. Wie gross ist sein Volumen (1 Würfel = 1 cm³)?`, a: l * b * h, unit: 'cm³', sol: [`${l} · ${b} = ${l * b} Würfel pro Schicht`, `${l * b} · ${h} = ${l * b * h} cm³`] }; });
T('kr-quader', '2.2.3', 'B', (p, r) => { const l = ri(r, 4, 12), b = ri(r, 3, 9), h = ri(r, 3, 8); return { q: `${art(p.vol, 'i')} ist ${l} dm lang, ${b} dm breit und ${h} dm hoch. Wie viele Liter fasst ${pro(p.vol)}?`, a: l * b * h, unit: 'l', sol: [`V = l · b · h = ${l} · ${b} · ${h} = ${l * b * h} dm³`, `1 dm³ = 1 l → ${l * b * h} l`] }; });
T('kr-material', '2.2.3', 'B', (p, r) => { const l = ri(r, 30, 80) / 10, b = ri(r, 20, 50) / 10, v = pick(r, [0.2, 0.25, 0.3, 0.4]); const A = rnd(l * b); return { q: `${art(p.area, 'd')} (${fmt(l, 1)} m × ${fmt(b, 1)} m) wird mit ${p.liq} behandelt. Verbrauch: ${fmt(v, 2)} l pro m². Wie viele Liter werden gebraucht?`, a: rnd(A * v), tol: 0.02, unit: 'l', sol: [`Fläche: ${fmt(l, 1)} · ${fmt(b, 1)} = ${fmt(A, 2)} m²`, `Bedarf: ${fmt(A, 2)} · ${fmt(v, 2)} = ${fmt(A * v, 2)} l`] }; });
T('kr-kante', '2.2.3', 'C', (p, r) => { const l = ri(r, 4, 15), b = ri(r, 3, 10), h = ri(r, 2, 9); return { q: `Ein Quader hat das Volumen ${fmt(l * b * h)} cm³ und eine Grundfläche von ${fmt(l * b)} cm². Wie hoch ist er?`, a: h, unit: 'cm', sol: ['V = G · h → h = V : G', `${fmt(l * b * h)} : ${fmt(l * b)} = ${h} cm`] }; });
T('kr-zylinder', '2.2.3', 'D', (p, r) => { const d = ri(r, 4, 12) * 5, h = ri(r, 3, 12) * 5; const V = PI * (d / 2) ** 2 * h / 1000; return { q: `${art(p.vol, 'c')} hat einen Innendurchmesser von ${d} cm und ist ${h} cm hoch. Wie viele Liter fasst ${pro(p.vol)}? (π = 3,14; auf 0,1 l runden; 1 l = 1000 cm³)`, a: rnd(V, 1), tol: 0.06, unit: 'l', sol: [`G = r² · π = ${d / 2}² · 3,14 = ${fmt(PI * (d / 2) ** 2, 1)} cm²`, `V = G · h = ${fmt(PI * (d / 2) ** 2 * h, 0)} cm³`, `: 1000 = ${fmt(V, 1)} l`] }; });
T('kr-pyramide', '2.2.3', 'E', (p, r) => { const a = ri(r, 3, 10), h = ri(r, 3, 12) * 3; return { q: `Eine Pyramide hat eine quadratische Grundfläche (Seite ${a} cm) und ist ${h} cm hoch. Wie gross ist ihr Volumen?`, a: a * a * h / 3, unit: 'cm³', sol: ['V = G · h : 3', `${a * a} · ${h} : 3 = ${fmt(a * a * h / 3)} cm³`] }; });
T('kr-kugel', '2.2.3', 'E', (p, r) => { const R = ri(r, 2, 9); return { q: `Eine Kugel hat den Radius ${R} cm. Wie gross ist ihr Volumen? (V = 4/3 · r³ · π, π = 3,14; auf ganze cm³ runden)`, a: Math.round(4 / 3 * R ** 3 * PI), tol: 1.2, unit: 'cm³', sol: [`r³ = ${R ** 3}`, `4/3 · ${R ** 3} · 3,14 = ${fmt(4 / 3 * R ** 3 * PI, 1)} cm³`] }; });

// --- 3.1.1 / 3.1.2 Einheiten und Grössen
T('ei-laenge', ['3.1.1', '3.1.2'], 'A', (p, r) => { const m = ri(r, 12, 480) / 100, mode = r() < 0.5; return mode ? { q: `Ein Zuschnitt (${p.len}) ist ${fmt(m, 2)} m lang. Wie viele Zentimeter sind das?`, a: rnd(m * 100), unit: 'cm', sol: ['1 m = 100 cm', `${fmt(m, 2)} · 100 = ${fmt(m * 100)} cm`] } : { q: `Ein Zuschnitt (${p.len}) ist ${fmt(rnd(m * 1000))} mm lang. Wie viele Meter sind das?`, a: m, unit: 'm', sol: ['1 m = 1’000 mm', `${fmt(rnd(m * 1000))} : 1’000 = ${fmt(m, 2)} m`] }; });
T('ei-masse', ['3.1.1', '3.1.2'], 'A', (p, r) => { const kg = ri(r, 5, 95) / 10, mode = r() < 0.5; return mode ? { q: `Für einen Auftrag werden ${fmt(kg, 1)} kg ${p.mat} benötigt. Wie viele Gramm sind das?`, a: kg * 1000, unit: 'g', sol: ['1 kg = 1’000 g', `${fmt(kg, 1)} · 1’000 = ${fmt(kg * 1000)} g`] } : { q: `Aus dem Lager werden ${fmt(kg * 1000)} g ${p.mat} geholt. Wie viele Kilogramm sind das?`, a: kg, unit: 'kg', sol: ['1 kg = 1’000 g', `${fmt(kg * 1000)} : 1’000 = ${fmt(kg, 1)} kg`] }; });
T('ei-hohl', '3.1.1', 'B', (p, r) => { const l = ri(r, 2, 90) / 20, mode = r() < 0.5; return mode ? { q: `Ein Gebinde enthält ${fmt(l, 2)} Liter ${p.liq}. Wie viele Milliliter sind das?`, a: rnd(l * 1000), unit: 'ml', sol: ['1 l = 1’000 ml', `${fmt(l, 2)} · 1’000 = ${fmt(l * 1000)} ml`] } : { q: `Du füllst ${fmt(rnd(l * 100))} dl ${p.liq} ab. Wie viele Liter sind das?`, a: rnd(l * 10), unit: 'l', sol: ['1 l = 10 dl', `${fmt(rnd(l * 100))} : 10 = ${fmt(rnd(l * 10), 2)} l`] }; });
T('ei-flaeche', '3.1.2', 'B', (p, r) => { const m = ri(r, 12, 95) / 10; return { q: `${art(p.area, 'i')} ist ${fmt(m, 1)} m² gross. Wie viele dm² sind das?`, a: m * 100, unit: 'dm²', sol: ['1 m² = 100 dm²', `${fmt(m, 1)} · 100 = ${fmt(m * 100)} dm²`] }; });
T('ei-zusammen', '3.1.1', 'C', (p, r) => { const k = ri(r, 3, 15) * 3.6; return { q: `Ein Fahrzeug fährt ${fmt(k, 1)} km/h. Wie viele Meter pro Sekunde sind das? (1 m/s = 3,6 km/h)`, a: k / 3.6, tol: 0.01, unit: 'm/s', sol: ['km/h in m/s: durch 3,6 teilen', `${fmt(k, 1)} : 3,6 = ${fmt(k / 3.6, 2)} m/s`] }; });
T('ei-zeit', '3.1.2', 'C', (p, r) => { const h = ri(r, 3, 19) / 4; return { q: `Ein Arbeitsschritt dauert ${fmt(h, 2)} Stunden. Wie viele Minuten sind das?`, a: h * 60, unit: 'min', sol: ['1 h = 60 min', `${fmt(h, 2)} · 60 = ${fmt(h * 60)} min`] }; });
T('ei-prozent', '3.1.2', 'C', (p, r) => { const kg = ri(r, 4, 40) * 5, pc = pick(r, [5, 10, 12, 20, 25]); return { q: `Ein Gebinde ${p.mat} wiegt ${kg} kg. Beim Trocknen gehen ${pc} % des Gewichts verloren. Wie viele kg bleiben?`, a: kg * (1 - pc / 100), unit: 'kg', sol: [`Verlust: ${kg} · ${pc} : 100 = ${fmt(kg * pc / 100, 2)} kg`, `Rest: ${kg} − ${fmt(kg * pc / 100, 2)} = ${fmt(kg * (1 - pc / 100), 2)} kg`] }; });
T('ei-si', '3.1.1', 'D', (p, r) => { const [u, f, t] = pick(r, [['km', 1e6, 'mm'], ['m', 1e3, 'mm'], ['kg', 1e6, 'mg'], ['m²', 1e4, 'cm²'], ['l', 1e3, 'ml']]); const x = ri(r, 2, 90) / 10; return { q: `Wandle ${fmt(x, 1)} ${u} in ${t} um.`, a: x * f, unit: t, sol: [`1 ${u} = ${fmtX(f)} ${t}`, `${fmt(x, 1)} · ${fmtX(f)} = ${fmtX(x * f)} ${t}`] }; });
T('ei-raum', '3.1.2', 'D', (p, r) => { const m = ri(r, 5, 60) / 10; return { q: `${art(p.vol, 'i')} fasst ${fmt(m, 1)} m³. Wie viele Liter sind das?`, a: m * 1000, unit: 'l', sol: ['1 m³ = 1’000 dm³ = 1’000 l', `${fmt(m, 1)} · 1’000 = ${fmt(m * 1000)} l`] }; });
T('ei-pumpe', '3.1.2', 'E', (p, r) => { const q = ri(r, 3, 12) * 5, t = ri(r, 4, 15); return { q: `Eine Pumpe fördert ${q} l pro Minute. Wie viele m³ sind es nach ${t} Stunden?`, a: q * t * 60 / 1000, unit: 'm³', sol: [`${t} h = ${t * 60} min`, `${q} · ${t * 60} = ${fmt(q * t * 60)} l`, `${fmt(q * t * 60)} l = ${fmt(q * t * 60 / 1000, 2)} m³`] }; });
T('ei-verbrauch', '3.1.2', 'E', (p, r) => { const v = ri(r, 55, 95) / 10, s = ri(r, 4, 30) * 25; return { q: `Ein Fahrzeug verbraucht ${fmt(v, 1)} Liter auf 100 km. Wie viele Liter braucht es für ${fmt(s)} km?`, a: v * s / 100, tol: 0.06, unit: 'l', sol: [`${fmt(s)} km sind ${fmt(s / 100, 2)} · 100 km`, `${fmt(v, 1)} · ${fmt(s / 100, 2)} = ${fmt(v * s / 100, 2)} l`] }; });

// --- 3.1.3 Daten erfassen und darstellen
const mvals = (p, r) => { const m = p.meas, dec = m.spread < 0.5 ? 2 : (m.spread < 5 ? 1 : 0); return { dec, v: Array.from({ length: 5 }, () => rnd(m.base + (r() * 2 - 1) * m.spread, dec)) }; };
const mlist = (p, v, dec) => v.map(x => fmt(x, dec)).join(' / ') + ' ' + p.meas.unit;
T('st-mittel', '3.1.3', 'A', (p, r) => { const { dec, v } = mvals(p, r); const S = v.reduce((a, b) => a + b, 0), mean = S / 5; return { q: `${p.meas.s}: ${mlist(p, v, dec)}. Berechne den Mittelwert.`, a: mean, tol: 0.5 * 10 ** -dec + 1e-9, unit: p.meas.unit, sol: [`Summe: ${fmt(S, dec)}`, `Mittelwert = ${fmt(S, dec)} : 5 = ${fmt(mean, dec + 1)}`] }; });
T('st-median', '3.1.3', 'A', (p, r) => { const { dec, v } = mvals(p, r); const s = [...v].sort((a, b) => a - b); return { q: `${p.meas.s}: ${mlist(p, v, dec)}. Bestimme den Median.`, a: s[2], unit: p.meas.unit, sol: [`Geordnet: ${mlist(p, s, dec)}`, `Mittlerer (3.) Wert = ${fmt(s[2], dec)}`] }; });
T('st-spann', '3.1.3', 'A', (p, r) => { const { dec, v } = mvals(p, r); const s = [...v].sort((a, b) => a - b); return { q: `${p.meas.s}: ${mlist(p, v, dec)}. Wie gross ist die Spannweite (Maximum − Minimum)?`, a: rnd(s[4] - s[0], dec), unit: p.meas.unit, sol: [`Maximum: ${fmt(s[4], dec)}, Minimum: ${fmt(s[0], dec)}`, `${fmt(s[4], dec)} − ${fmt(s[0], dec)} = ${fmt(s[4] - s[0], dec)}`] }; });
T('st-zeit', '3.1.3', 'B', (p, r) => { const h = ri(r, 1, 7), m = pick(r, [15, 30, 45]); return { q: `Ein Auftrag dauert ${h} h ${m} min. Wie viele Stunden sind das als Dezimalzahl?`, a: h + m / 60, unit: 'h', sol: [`${m} min = ${m} : 60 = ${fmt(m / 60, 2)} h`, `${h} + ${fmt(m / 60, 2)} = ${fmt(h + m / 60, 2)} h`] }; });
T('st-anteil', '3.1.3', 'C', (p, r) => { const v = [ri(r, 4, 20) * 5, ri(r, 4, 20) * 5, ri(r, 4, 20) * 5, ri(r, 4, 20) * 5]; const S = v.reduce((a, b) => a + b, 0); return { q: `Ein Säulendiagramm zeigt die Verkäufe von vier Wochen: ${v.join(', ')} ${p.obj}. Wie viel Prozent der Verkäufe entfallen auf die beste Woche? (auf 1 Dezimale runden)`, a: rnd(Math.max(...v) / S * 100, 1), tol: 0.06, unit: '%', sol: [`Gesamt: ${S}; beste Woche: ${Math.max(...v)}`, `${Math.max(...v)} : ${S} · 100 = ${fmt(Math.max(...v) / S * 100, 1)} %`] }; });
T('st-gewichtet', '3.1.3', 'D', (p, r) => { const a = ri(r, 2, 4), b = ri(r, 2, 4), x = ri(r, 5, 7), y = ri(r, 8, 10); return { q: `An ${a} Tagen wird ${x} h gearbeitet, an ${b} Tagen ${y} h. Wie viele Stunden pro Tag sind es im Durchschnitt? (auf 2 Dezimalen)`, a: (a * x + b * y) / (a + b), tol: 0.006, unit: 'h', sol: [`Stunden total: ${a} · ${x} + ${b} · ${y} = ${a * x + b * y}`, `Tage: ${a + b}`, `${a * x + b * y} : ${a + b} = ${fmt((a * x + b * y) / (a + b), 2)} h`] }; });

// --- 3.2.1 Proportionalität
T('pr-dreisatz', '3.2.1', 'A', (p, r) => { const n1 = ri(r, 4, 12) * 5, n2 = n1 * ri(r, 2, 5) + ri(r, 0, 1) * 5, pr = price(p, r); return { q: `${n1} ${p.obj} kosten Fr. ${fmt(n1 * pr, 2)}. Wie viel kosten ${n2} ${p.obj}?`, a: n2 * pr, unit: 'Fr.', sol: [`${n1} Stück → Fr. ${fmt(n1 * pr, 2)}`, `1 Stück → ${fmt(n1 * pr, 2)} : ${n1} = Fr. ${fmt(pr, 2)}`, `${n2} Stück → ${fmt(pr, 2)} · ${n2} = Fr. ${fmt(n2 * pr, 2)}`] }; });
T('pr-liter', '3.2.1', 'A', (p, r) => { const x = ri(r, 2, 6), y = x * ri(r, 4, 9), z = x * ri(r, 7, 15); return { q: `${x} Liter ${p.liq} reichen für ${y} m². Für wie viele m² reichen ${z} Liter?`, a: y / x * z, unit: 'm²', sol: [`${x} l → ${y} m²`, `1 l → ${y} : ${x} = ${fmt(y / x)} m²`, `${z} l → ${fmt(y / x)} · ${z} = ${fmt(y / x * z)} m²`] }; });
T('pr-faktor', '3.2.1', 'B', (p, r) => { const x = ri(r, 3, 9), f = ri(r, 2, 9) * 0.5; return { q: `Eine Tabelle ordnet der Menge ${x} die Kosten Fr. ${fmt(x * f, 2)} zu (proportional). Wie viel kostet die Menge ${x + 6}?`, a: (x + 6) * f, unit: 'Fr.', sol: [`Faktor: ${fmt(x * f, 1)} : ${x} = ${fmt(f, 1)}`, `${x + 6} · ${fmt(f, 1)} = ${fmt((x + 6) * f, 1)} Fr.`] }; });
T('pr-rabatt', '3.2.1', 'C', (p, r) => { const G = ri(r, 4, 40) * 100, pc = pick(r, [5, 8, 10, 12, 15, 20]); return { q: `Eine Bestellung von ${p.obj} kostet Fr. ${fmt(G, 2)}. Die Lieferantin gewährt ${pc} % Rabatt. Wie hoch ist der Rabatt in Franken?`, a: G * pc / 100, unit: 'Fr.', sol: ['Prozentwert = Grundwert · Prozentsatz', `${fmt(G)} · ${pc} : 100 = ${fmt(G * pc / 100, 2)} Fr.`] }; });

// === SVG-Helfer (fachunabhängig): Diagramme, Raster, Zahlenstrahl, Pläne ===
const SVGW = (w, h, body, label) => `<svg viewBox="0 0 ${w} ${h}" width="${w}" role="img" aria-label="${label || 'Abbildung'}" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-size="11" fill="#222">${body}</svg>`;
const sx = (v, a, b, p0, p1) => p0 + (v - a) / (b - a) * (p1 - p0);
// Liniendiagramm mit Gitter. lines: [{pts:[[x,y],…], color, label}]
function svgLines({ xmax, ymax, xstep, ystep, lines, xl = '', yl = '', w = 320, h = 220, label }) {
  const L = 38, R = w - 12, B = h - 32, T = 12; let o = '';
  for (let x = 0; x <= xmax + 1e-9; x += xstep) { const X = sx(x, 0, xmax, L, R); o += `<line x1="${X}" y1="${T}" x2="${X}" y2="${B}" stroke="#d5dbe5"/><text x="${X}" y="${B + 13}" text-anchor="middle">${fmt(x)}</text>`; }
  for (let y = 0; y <= ymax + 1e-9; y += ystep) { const Y = sx(y, 0, ymax, B, T); o += `<line x1="${L}" y1="${Y}" x2="${R}" y2="${Y}" stroke="#d5dbe5"/><text x="${L - 4}" y="${Y + 4}" text-anchor="end">${fmt(y)}</text>`; }
  o += `<line x1="${L}" y1="${B}" x2="${R}" y2="${B}" stroke="#222"/><line x1="${L}" y1="${T}" x2="${L}" y2="${B}" stroke="#222"/><text x="${R}" y="${h - 4}" text-anchor="end">${xl}</text><text x="${L}" y="${T - 2}" >${yl}</text>`;
  lines.forEach(l => { o += `<polyline fill="none" stroke="${l.color}" stroke-width="2.2" points="${l.pts.map(([x, y]) => sx(x, 0, xmax, L, R).toFixed(1) + ',' + sx(y, 0, ymax, B, T).toFixed(1)).join(' ')}"/>`; if (l.label) { const [x, y] = l.pts[l.pts.length - 1]; o += `<text x="${sx(x, 0, xmax, L, R) - 4}" y="${sx(y, 0, ymax, B, T) - 6}" fill="${l.color}" text-anchor="end" font-weight="700">${l.label}</text>`; } if (l.dots) l.pts.forEach(([x, y]) => o += `<circle cx="${sx(x, 0, xmax, L, R)}" cy="${sx(y, 0, ymax, B, T)}" r="3.5" fill="${l.color}"/>`); });
  return SVGW(w, h, o, label || 'Liniendiagramm');
}
function svgBars({ labels, vals, ymax, ystep, w = 320, h = 200, unit = '', label }) {
  const L = 38, R = w - 10, B = h - 28, T = 14, n = vals.length, bw = (R - L) / n; let o = '';
  for (let y = 0; y <= ymax + 1e-9; y += ystep) { const Y = sx(y, 0, ymax, B, T); o += `<line x1="${L}" y1="${Y}" x2="${R}" y2="${Y}" stroke="#d5dbe5"/><text x="${L - 4}" y="${Y + 4}" text-anchor="end">${fmt(y)}</text>`; }
  vals.forEach((v, i) => { const x = L + i * bw + bw * 0.18, Y = sx(v, 0, ymax, B, T); o += `<rect x="${x}" y="${Y}" width="${bw * 0.64}" height="${B - Y}" fill="#4a86d8"/><text x="${x + bw * 0.32}" y="${B + 14}" text-anchor="middle">${labels[i]}</text>`; });
  o += `<line x1="${L}" y1="${B}" x2="${R}" y2="${B}" stroke="#222"/><text x="${L}" y="${T - 3}">${unit}</text>`;
  return SVGW(w, h, o, label || 'Säulendiagramm');
}
// Zahlenstrahl 0..1 mit Markierung bei pos (0..1) und Beschriftung der Teilung
function svgStrahl({ from = 0, to = 1, mark, ticks, w = 320, label }) {
  const L = 20, R = w - 20, Y = 40; let o = `<line x1="${L}" y1="${Y}" x2="${R}" y2="${Y}" stroke="#222" stroke-width="2"/>`;
  for (let i = 0; i <= ticks; i++) { const x = L + i / ticks * (R - L); o += `<line x1="${x}" y1="${Y - 6}" x2="${x}" y2="${Y + 6}" stroke="#222"/>`; }
  o += `<text x="${L}" y="${Y + 22}" text-anchor="middle">${fmt(from)}</text><text x="${R}" y="${Y + 22}" text-anchor="middle">${fmt(to)}</text>`;
  const mx = L + (mark - from) / (to - from) * (R - L); o += `<polygon points="${mx - 6},${Y - 22} ${mx + 6},${Y - 22} ${mx},${Y - 8}" fill="#d9534f"/>`;
  return SVGW(w, 70, o, label || 'Zahlenstrahl');
}
// Koordinatengitter mit beschrifteten Punkten: pts [{n,x,y}], Bereich 0..m
function svgGrid({ m = 8, pts = [], poly = [], vline, cell = 28, label }) {
  const P = 26, S = P * 2 + m * cell; let o = '';
  for (let i = 0; i <= m; i++) { const p = P + i * cell; o += `<line x1="${p}" y1="${P}" x2="${p}" y2="${P + m * cell}" stroke="#d5dbe5"/><line x1="${P}" y1="${p}" x2="${P + m * cell}" y2="${p}" stroke="#d5dbe5"/><text x="${p}" y="${P + m * cell + 14}" text-anchor="middle">${i}</text><text x="${P - 6}" y="${P + m * cell - i * cell + 4}" text-anchor="end">${i}</text>`; }
  const gx = x => P + x * cell, gy = y => P + (m - y) * cell;
  if (vline !== undefined) o += `<line x1="${gx(vline)}" y1="${P}" x2="${gx(vline)}" y2="${P + m * cell}" stroke="#d9534f" stroke-width="2" stroke-dasharray="5 4"/>`;
  if (poly.length) o += `<polygon points="${poly.map(([x, y]) => gx(x) + ',' + gy(y)).join(' ')}" fill="rgba(74,134,216,.35)" stroke="#2d63b5" stroke-width="2"/>`;
  pts.forEach(p => o += `<circle cx="${gx(p.x)}" cy="${gy(p.y)}" r="4" fill="#d9534f"/><text x="${gx(p.x) + 6}" y="${gy(p.y) - 6}" font-weight="700">${p.n}</text>`);
  return SVGW(S, S, o, label || 'Koordinatensystem');
}
// Rechteck mit Massangaben (Plan oder Skizze)
function svgRect({ l, b, ll, bl, w = 300, h = 180, label }) {
  const k = Math.min((w - 70) / l, (h - 60) / b), X = 40, Y = 20, W = l * k, H = b * k;
  return SVGW(w, h, `<rect x="${X}" y="${Y}" width="${W}" height="${H}" fill="#eaf1fc" stroke="#2d63b5" stroke-width="2"/><text x="${X + W / 2}" y="${Y + H + 18}" text-anchor="middle" font-weight="700">${ll}</text><text x="${X - 8}" y="${Y + H / 2}" text-anchor="end" font-weight="700">${bl}</text>`, label || 'Plan');
}
// Rechtwinkliges Dreieck mit Beschriftung der Katheten/Hypotenuse (Texte, '?' für gesucht)
function svgRight({ a, b, la = a, lb = b, lc = '', w = 300, h = 190, label }) {
  const k = Math.min((w - 70) / b, (h - 50) / a), X = 30, Y = h - 28, bx = b * k, ay = a * k;
  return SVGW(w, h, `<polygon points="${X},${Y} ${X + bx},${Y} ${X},${Y - ay}" fill="#eaf1fc" stroke="#2d63b5" stroke-width="2"/><rect x="${X}" y="${Y - 10}" width="10" height="10" fill="none" stroke="#222"/><text x="${X + bx / 2}" y="${Y + 16}" text-anchor="middle" font-weight="700">${lb}</text><text x="${X - 6}" y="${Y - ay / 2}" text-anchor="end" font-weight="700">${la}</text><text x="${X + bx / 2 + 8}" y="${Y - ay / 2 - 6}" font-weight="700">${lc}</text>`, label || 'Rechtwinkliges Dreieck');
}
// Figurenfolge aus Quadraten: Zeile mit n Quadraten je Figur (Anzahl pro Figur: counts[])
function svgFiguren({ counts, size = 12, per = 6 }) {
  let x = 6, o = '', H = 0;
  counts.forEach((n, i) => { const cols = Math.min(n, per), rows = Math.ceil(n / per); for (let k = 0; k < n; k++) o += `<rect x="${x + (k % per) * (size + 1)}" y="${18 + Math.floor(k / per) * (size + 1)}" width="${size}" height="${size}" fill="#4a86d8"/>`; o += `<text x="${x}" y="12" font-weight="700">Fig. ${i + 1}</text>`; x += cols * (size + 1) + 18; H = Math.max(H, 18 + rows * (size + 1)); });
  return SVGW(x, H + 8, o, 'Figurenfolge');
}
// Säulen aus Würfeln in der Aufsicht: Grundriss mit Zahlen
function svgGrundriss(g, cell = 34) {
  const R = g.length, C = g[0].length; let o = '';
  g.forEach((row, i) => row.forEach((v, j) => o += `<rect x="${24 + j * cell}" y="${14 + i * cell}" width="${cell}" height="${cell}" fill="#eaf1fc" stroke="#2d63b5"/><text x="${24 + j * cell + cell / 2}" y="${14 + i * cell + cell / 2 + 4}" text-anchor="middle" font-weight="700">${v}</text>`));
  o += `<text x="${24 + C * cell / 2}" y="${R * cell + 30}" text-anchor="middle" fill="#555">vorne (Blick von hier)</text>`;
  return SVGW(C * cell + 48, R * cell + 40, o, 'Grundriss mit Würfelzahlen');
}

const OPT = (r, q, correct, wrong, sol, extra) => { const w = [...new Set(wrong.filter(x => x !== correct))]; return Object.assign({ q, sol }, shuffleOpts(r, [correct, ...w]), extra || {}); };

T('s-rabatt', '4.1.1', 'B', (p, r) => { const P = ri(r, 8, 90) * 10, d = pick(r, [10, 15, 20, 25, 30, 35]); const n = P * (100 - d) / 100; return { q: `Ein Gerät kostet ${fmt(P)} Fr. Im Ausverkauf gibt es ${d} % Rabatt. Wie viel kostet das Gerät im Ausverkauf?`, a: n, unit: 'Fr.', sol: [`Faktor: 1 − ${d} % = ${fmt((100 - d) / 100)}`, `${fmt(P)} · ${fmt((100 - d) / 100)} = ${fr(n)}`] }; });
T('s-mwst', '4.1.1', 'B', (p, r) => { const N = ri(r, 3, 40) * 50; const B = rnd(N * 1.081); return { q: `Der Nettopreis einer Maschine beträgt ${fmt(N)} Fr. Dazu kommen 8,1 % Mehrwertsteuer. Wie hoch ist der Bruttopreis?`, a: B, unit: 'Fr.', tol: 0.01, sol: [`Faktor: 1,081`, `${fmt(N)} · 1,081 = ${fr(B)}`] }; });

T('s-pfad-ohne', '4.4.2', 'D', (p, r) => { const t = pick(r, [8, 10, 12]), a = ri(r, 3, t - 3); return { q: `In einer Schachtel liegen ${a} rote und ${t - a} blaue Stifte. Du nimmst zwei Stifte nacheinander, ohne einen zurückzulegen. Wie gross ist die Wahrscheinlichkeit, dass beide rot sind? (in Prozent, auf 2 Stellen gerundet)`, a: rnd(a / t * (a - 1) / (t - 1) * 100), unit: '%', tol: 0.01, sol: [`Erster Stift rot: ${a}/${t}`, `Zweiter Stift rot: ${a - 1}/${t - 1}`, `${a}/${t} · ${a - 1}/${t - 1} = ${fr(a / t * (a - 1) / (t - 1) * 100)} %`] }; });
T('s-anordnung', '4.4.2', 'E', (p, r) => { const n = ri(r, 4, 6), k = ri(r, 3, 4) , all = r() < 0.5; if (all) { let f = 1; for (let i = 2; i <= n; i++) f *= i; return { q: `${n} Kinder stellen sich in einer Reihe auf. Auf wie viele Arten ist das möglich?`, a: f, unit: 'Arten', sol: [`${n}! = ${Array.from({ length: n }, (_, i) => n - i).join(' · ')} = ${f}`] }; } const m = n + 2; let v = 1; for (let i = 0; i < k; i++) v *= m - i; return { q: `${m} Läuferinnen nehmen an einem Rennen teil. Wie viele verschiedene Ranglisten sind für die Plätze 1 bis ${k} möglich?`, a: v, unit: 'Ranglisten', sol: [`${Array.from({ length: k }, (_, i) => m - i).join(' · ')} = ${v}`] }; });
T('s-haendedruck', '4.4.2', 'E', (p, r) => { const n = ri(r, 5, 12); return { q: `${n} Personen begrüssen sich bei einem Treffen. Jede Person gibt jeder anderen genau einmal die Hand. Wie viele Händedrücke gibt es?`, a: n * (n - 1) / 2, unit: 'Händedrücke', sol: [`Jede der ${n} Personen schüttelt ${n - 1} Hände: ${n} · ${n - 1} = ${n * (n - 1)}`, `Jeder Händedruck ist doppelt gezählt: ${n * (n - 1)} : 2 = ${n * (n - 1) / 2}`] }; });

function shortName(n) {
  const sc = TRACKS.find(t => t.name === n && t.short); if (sc) return sc.short;
  const seg = n.split(/\s+\/\s*|\s*\/\s+/); let first = seg[0].replace(/\s+(EFZ|EBA)\b/g, '').replace(/\s+/g, ' ').trim();
  const rest = seg.slice(1).join(' / ').replace(/\b(EFZ|EBA)\b/g, '');
  const extra = (rest.match(/(Fachrichtung\s+[A-Za-zäöüÄÖÜéèß]+|Profil [EG])\b/) || [])[0];
  if (extra && !first.includes(extra)) first += ' · ' + extra;
  return first.replace(/\s*\/\s*$/, '').trim() || n;
}
const levelWord = l => (S.levels && S.levels[l]) || l;

// Fortschrittssterne (3): aus abgehakten Fähigkeiten und letztem Testresultat, nur über gefordertes Niveau
function starsHtml(c) {
  const ri = reqItems(c); if (!ri.length) return '';
  const lt = lastTest(), tr = lt && lt.comps[c.id], rc = ri.filter(i => prog.can.has(i.idx)).length / ri.length, rt = tr ? tr.c / tr.t : 0, r = Math.max(rc, rt);

  return `<span class="stars" role="img" aria-label="Fortschritt: ${n} von 3 Sternen" title="Fortschritt: ${n} von 3 Sternen">${'★'.repeat(n)}<span class="e">${'★'.repeat(3 - n)}</span></span>`;
}

function sourceNote() {
  const sch = state.track && state.track.type === 'SCHULE';
  return (sch || (!state.track && state.typ === 'SCHULE') ? `<p class="small"><b>Weiterführende Schulen:</b> Stoff und Aufbau stammen aus den Prüfungsanforderungen der Aufnahmeprüfungen im Kanton St.Gallen (Gymnasium; Einheitsaufnahmeprüfung für FMS, WMS, IMS und BM1, Stand 2020 mit Terminen 2026/27), ergänzt durch Stoffprogramme und Eckwerte anderer Kantone (SZ, SO, AR, AG) und den Lehrplan 21. Die Einteilung in die Stufen A–E und die Zuordnung zu den Schulen ist eine Einschätzung auf Grundlage alter Prüfungen, kein amtliches Raster. Die Aufgaben sind eigene Aufgaben im Stil dieser Prüfungen. Die Note der Prüfungssimulation ist eine grobe Schätzung. Massgebend sind immer die Unterlagen deiner Schule.</p>` : '') + `<p class="small">Anforderungen: Kompetenzraster «Mathematik-Anforderungen beim Eintritt in die Berufslehre» der Bildungs- und Kulturdirektion des Kantons Bern (<a href="https://www.bkd-kompetenzraster-ktbern.ch/" target="_blank" rel="noopener">bkd-kompetenzraster-ktbern.ch</a>), Raster-Version Februar 2018, abgerufen am 27.10.2026. «Gefordert» bedeutet: im Kompetenzraster des Berufs als erforderlich (grün) markiert. Die Aufgaben sind eigene, berufsnahe Vorlagen und keine Übernahmen aus Lehrmitteln. Die Angaben des Kantons Bern sind Richtwerte; verbindlich sind die Vorgaben deines Lehrbetriebs und der Berufsschule.</p>
  <p class="small"><b>Ergänzung:</b> Auf <a href="https://www.anforderungsprofile.ch/" target="_blank" rel="noopener">anforderungsprofile.ch</a> (Schweizerischer Gewerbeverband, EDK, SBFI) findest du für fast alle Berufe Profile zu Mathematik, Schulsprache, Fremdsprachen und Naturwissenschaften. Dort gilt eine andere Skala (einfache bis sehr hohe Anforderungen); die Stufen A–E des Berner Rasters sind damit nicht gleichzusetzen. Zufall und Daten findest du nur dort. Bei grossen Unterschieden: nicht entmutigen lassen, sondern mit Eltern, Lehrperson oder Berufsberatung besprechen.</p>`;
