document.addEventListener('click', e => {
  const t = e.target;
  const pth = t.closest('[data-path]'); if (pth) { state.typ = pth.dataset.path === 'schule' ? 'SCHULE' : (state.typ === 'SCHULE' ? 'EFZ' : state.typ); return render(); }
  const typ = t.closest('[data-typ]'); if (typ) { state.typ = typ.dataset.typ; return render(); }
  const tr = t.closest('[data-track]'); if (tr) return setTrack(TRACKS.find(x => x.id === tr.dataset.track));
  if (t.closest('#generic')) return setTrack(genericTrack(($('#q').value || '').trim() || 'Allgemein'));
  if (t.closest('#wipe')) { if (confirm('Alle gespeicherten Daten (Haken, Tests, Fortschritt) auf diesem Gerät löschen?')) { try { Object.keys(localStorage).filter(k => k.startsWith('bf2-')).forEach(k => localStorage.removeItem(k)); } catch (e) { } try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { } location.reload(); } return; }
  if (t.closest('#change')) { state.track = null; state.q = ''; state.dossier = ''; store.set('track', null); try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { } return render(); }
  const tab = t.closest('[data-tab]'); if (tab) { state.tab = tab.dataset.tab; render(); return window.scrollTo(0, 0); }
  const pr = t.closest('[data-practice]'); if (pr) { if (!state.sel.includes(pr.dataset.practice)) { state.sel.push(pr.dataset.practice); saveSel(); } state.comp = pr.dataset.practice; state.tab = 'ueben'; state.round = 1; render(); return window.scrollTo(0, 0); }
  const tn = t.closest('[data-testn]'); if (tn) { state.test = buildTest(+tn.dataset.testn, !!tn.dataset.quick); store.set('draft-' + state.track.id, null); return render(); }
  const sm = t.closest('[data-sim]'); if (sm) { state.test = buildSim(sm.dataset.sim); render(); return window.scrollTo(0, 0); }
  if (t.closest('#simgaps')) { const need = (state.test && state.test.res && state.test.res.gaps) || []; if (need.length) { state.sel = need; saveSel(); state.comp = need[0]; state.tab = 'ueben'; state.round = 1; render(); return window.scrollTo(0, 0); } }
  if (t.closest('#resumetest')) { const dr = store.get('draft-' + state.track.id, null); if (dr) { state.test = { n: dr.tn, qs: dr.qs, ans: dr.ans, done: false, res: null, quick: dr.quick, nAll: dr.nAll }; } return render(); }
  if (t.closest('#dropdraft')) { store.set('draft-' + state.track.id, null); return render(); }
  if (t.closest('#pausetest')) { saveDraft(); state.test = null; render(); return window.scrollTo(0, 0); }
  if (t.closest('#seegaps')) { const r = lastTest(); if (r) { state.test = { done: true, res: r, rows: null }; state.tab = 'test'; render(); return window.scrollTo(0, 0); } }
  const lr = t.closest('[data-learn]'); if (lr) { const id = lr.dataset.learn; if (!state.sel.includes(id)) { state.sel.push(id); saveSel(); } state.focus = [id]; state.tab = 'theorie'; render(); return window.scrollTo(0, 0); }
  if (t.closest('#submittest')) { readTest(); const open = state.test.qs.length - Object.keys(state.test.ans).filter(i => { const a = state.test.ans[i]; return a !== null && a !== undefined && (Array.isArray(a) ? a.some(x => x.trim()) : String(a).trim()); }).length; if (open && !confirm(`${open} Aufgabe(n) sind noch offen und zählen als nicht gelöst. Test jetzt abgeben?`)) return; gradeTest(); render(); return window.scrollTo(0, 0); }
  if (t.closest('#canceltest')) { if (confirm('Test abbrechen? Deine Antworten gehen verloren. (Mit «Pausieren» bleiben sie gespeichert.)')) { store.set('draft-' + state.track.id, null); state.test = null; render(); } return; }
  if (t.closest('#retest')) { state.test = null; return render(); }
  if (t.closest('#lasttest')) { state.test = { done: true, res: lastTest(), rows: null }; return render(); }
  if (t.closest('#gapsel')) { store.set(seenKey(), true); const res = (state.test && state.test.res) || lastTest(), need = Object.keys(res.comps).filter(id => statusOf(res.comps[id].c / res.comps[id].t) !== 'ok'); state.sel = need; saveSel(); state.comp = need[0]; state.tab = 'ueben'; state.round = 1; render(); return window.scrollTo(0, 0); }
  if (t.closest('#newr')) { state.round++; return render(); }
  const pp = t.closest('[data-paper]'); if (pp) return buildPaper(pp.dataset.paper);
  if (t.closest('#mk')) return buildDossier();
  if (t.closest('#print')) { if (!state.dossier) buildDossier(); return window.print(); }
  const exEl = t.closest('.ex');
  if (exEl && t.closest('.show')) { const s = exEl.querySelector('.sol'); s.hidden = !s.hidden; return; }
  if (exEl && t.closest('.check')) {
    const tp = S.templates.find(x => x.id === exEl.dataset.tpl), ex = makeExercise(tp, vocab(), +exEl.dataset.seed), fb = exEl.querySelector('.fb');
    const k = exKind(ex); let inp, empty;
    if (k === 'opts') { const c = exEl.querySelector('input:checked'); inp = c ? c.value : null; empty = inp === null; }
    else if (k === 'fields') { inp = [...exEl.querySelectorAll('.ans')].map(x => x.value); empty = inp.every(v => !v.trim()); }
    else { inp = exEl.querySelector('.ans').value; empty = !inp.trim(); }
    if (empty) { fb.className = 'fb'; fb.textContent = k === 'opts' ? 'Bitte wähle eine Antwort.' : 'Bitte gib eine Antwort ein.'; return; }
    const bad = k === 'num' ? isNaN(parseAnswer(inp)) : k === 'fields' ? inp.some(v => v.trim() && isNaN(parseAnswer(v))) : false;
    if (bad) { fb.className = 'fb bad'; fb.textContent = 'Das ist keine Zahl, die ich lesen kann. Schreibe nur die Zahl, zum Beispiel 12,5 oder 3/8 (die Einheit steht schon dahinter).'; return; }
    const res = checkExercise(ex, inp);
    if (k === 'fields') exEl.querySelectorAll('.ans').forEach((x, j) => x.style.borderColor = res[j] ? 'var(--ok)' : 'var(--bad)');
    if (res.every(Boolean)) { state.streak = (state.streak || 0) + 1; const PR = ['Richtig!', 'Genau!', 'Stark!', 'Sauber gerechnet!', 'Top!']; const nOk = okCount(exEl.dataset.comp) + 1; fb.className = 'fb ok'; fb.textContent = '✓ ' + PR[nOk % PR.length] + (state.streak >= 3 ? ` ${state.streak} in Folge!` : '') + (nOk > 0 && nOk % 10 === 0 ? ` Schon ${nOk} Aufgaben in diesem Thema gelöst.` : ''); markOk(exEl.dataset.comp, tp.id + ':' + ex.seed); const sm = document.querySelector('#view .row .small'); if (sm) sm.textContent = okCount(exEl.dataset.comp) + ' richtig gelöst'; }
    else { state.streak = 0; fb.className = 'fb bad'; const hint = k === 'num' ? hintFor(ex, inp) : ''; fb.textContent = hint ? 'Noch nicht ganz. ' + hint : k === 'fields' ? `${res.filter(Boolean).length} von ${res.length} Feldern stimmen. Rot markierte Felder nochmals prüfen.` : 'Noch nicht ganz – das ist Teil des Lernens. Versuche es nochmals oder schau den Lösungsweg an.'; }
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.closest && t.closest('.tq')) return updateTestProg();
  if (t.id === 'onlygaps') { state.onlyGaps = t.checked; return render(); }
  if (t.id === 'showall') { state.all = t.checked; return render(); }
  if (t.id === 'onlyreq') { state.onlyReq = t.checked; state.round = 1; return render(); }
  if (t.id === 'pc') { state.comp = t.value; state.round = 1; return render(); }
  if (t.dataset && t.dataset.sel) { state.sel = S.comps.map(c => c.id).filter(id => id === t.dataset.sel ? t.checked : state.sel.includes(id)); saveSel(); state.dossier = ''; return; }
  if (t.dataset && t.dataset.can !== undefined) { const set = prog.can, i = +t.dataset.can; t.checked ? set.add(i) : set.delete(i); saveCan(set); const c = S.comps.find(x => x.items.some(it => it.idx === i)); const sm = $('#sum-' + c.id); if (sm) { const ri = reqItems(c), n = ri.filter(it => set.has(it.idx)).length; sm.textContent = ri.length ? `Das musst du können (${ri.length}) · Kann ich: ${n}` : `Fähigkeiten ansehen (${c.items.length})`; } }
});
document.addEventListener('input', e => { if (e.target.id === 'q') { state.q = e.target.value; updateList(); } if (e.target.closest && e.target.closest('.tq')) updateTestProg(); });
function saveDraft() { const T = state.test; if (!T || T.done || T.sim) return; readTest(); const n = T.qs.filter((q, i) => { const a = T.ans[i]; return a !== null && a !== undefined && (Array.isArray(a) ? a.some(x => (x || '').trim()) : String(a).trim()); }).length; store.set('draft-' + state.track.id, n ? { tn: T.n, qs: T.qs, ans: T.ans, n, quick: T.quick, nAll: T.nAll } : null); }
function updateTestProg() { if (!state.test || state.test.done) return; readTest(); const T = state.test, n = T.qs.filter((q, i) => { const a = T.ans[i]; return a !== null && a !== undefined && (Array.isArray(a) ? a.some(x => x.trim()) : String(a).trim()); }).length; const p = $('#tprog'), b = $('#tbar'); if (p) p.textContent = `${n} von ${T.qs.length} beantwortet`; saveDraft(); if (b) b.style.width = Math.round(n / T.qs.length * 100) + '%'; }
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.classList && e.target.classList.contains('ans')) e.target.closest('.ex').querySelector('.check').click();
});

(function init() {
  let saved = store.get('track', null);
  const hm = (location.hash || '').match(/^#t=([a-z0-9-]+)/); // Direktlink, z. B. index.html#t=gymnasium-kanti
  if (hm) { const t = TRACKS.find(x => x.id === hm[1]); if (t) saved = { id: t.id, name: t.name, type: t.type }; }
  if (saved && saved.id) { state.typ = saved.type === 'ALLG' ? 'EFZ' : saved.type; const t = saved.id === 'allgemein' ? genericTrack(saved.name) : TRACKS.find(x => x.id === saved.id); if (t) { state.track = t; state.sel = (store.get('sel-' + t.id, null) || defaultPath(t, S)).filter(id => compById(id)); state.comp = state.sel[0] || null; } }
  render();
})();

</script>
